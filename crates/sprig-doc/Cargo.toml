[package]
name = "sprig-doc"
description = "SprigDB: The document engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bson = "=2.15.0"
# $regex matching in the recheck (MIT or Apache-2.0).
regex = "1.11"
serde_json.workspace = true
sprig-proto-mongo = { path = "../sprig-proto-mongo" }
# Geodesy and S2 for the geo operators (chapter 36, R6 round 3).
sprig-geo = { path = "../sprig-geo" }
# Heavy steps off the runtime's workers, and the active collation as a
# task-local value (R5 round 4).
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
# Canonical decomposition for collations (MIT or Apache-2.0; already in
# the lockfile through url/idna).
unicode-normalization = "0.1.25"

[dev-dependencies]
# The live test of the generated SQL, straight on MariaDB.
mysql_async.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
