[package]
name = "sprig-doc"
description = "SprigDB: The document engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bson = "=2.15.0"
# $regex matching in the recheck (MIT or Apache-2.0).
regex = "1.11"
serde_json.workspace = true
# Aggregation expressions: time zones for the date
# expressions (MIT or Apache-2.0; already in the lockfile through
# sprig-graph), and the digests of `$hash`/`$hexHash` (MIT or Apache-2.0).
chrono = "0.4.45"
chrono-tz = "0.10.4"
md-5 = "0.10.6"
sha2.workspace = true
twox-hash = { workspace = true, features = ["xxhash64"] }
# Exact Decimal128 arithmetic: the accumulators and window functions, and
# the 34-digit decimal functions (MIT or Apache-2.0; all already in the
# lockfile).
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
sprig-proto-mongo = { path = "../sprig-proto-mongo" }
# Geodesy and S2 for the geo operators.
sprig-geo = { path = "../sprig-geo" }
# Heavy steps off the runtime's workers, and the active collation as a
# task-local value.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
# Logs writes that fail validation under `validationAction: warn`.
tracing.workspace = true
# Canonical decomposition for collations (MIT or Apache-2.0; already in
# the lockfile through url/idna).
unicode-normalization = "0.1.25"

[dev-dependencies]
# Server-side JavaScript's tests run on SprigDB's QuickJS.
sprig-logic-js.workspace = true
# The live test of the generated SQL, straight on MariaDB.
mysql_async.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
