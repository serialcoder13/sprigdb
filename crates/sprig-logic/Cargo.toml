[package]
name = "sprig-logic"
description = "SprigDB: The logic layer: catalog of code, invocation, budgets and the db interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# Schedules: cron times in IANA time zones (both already in the lock, through `kirun`).
chrono = "0.4"
chrono-tz = "0.10"
mysql_async.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sprig-binlog.workspace = true
sprig-catalog.workspace = true
sprig-common.workspace = true
# After-commit triggers read the change feed (chapter 38).
sprig-feed.workspace = true
sprig-logic-compile = { path = "../sprig-logic-compile" }
# `SELECT f(constants)` of engine-tier functions: the calls are found in
# the client's text (R7 order 6).
sqlparser.workspace = true
# The fallback tier (R7 order 4): the native KIRun runtime.
sprig-logic-js.workspace = true
sprig-meta.workspace = true
sprig-settings.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "test-util"] }

[lints]
workspace = true
