[package]
name = "sprig-approvals"
description = "SprigDB: Approvals and recommendations for every automatic decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# The sprig_approvals_* metrics.
metrics.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
# Fingerprints: the first 128 bits of SHA-256.
sha2.workspace = true
# SMTP over TLS (STARTTLS and implicit TLS): the workspace's rustls with
# ring, PEM files for the CA and the client certificate, and the Mozilla
# roots (the same `webpki-roots` 1.x sprig-sinks uses; CDLA-Permissive-2.0
# data under an MPL-2.0 crate, already in the tree).
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots = "1"
# The `approvals` migration module and the catalog locator.
sprig-catalog.workspace = true
sprig-common.workspace = true
# Failover items in the DC and global tiers.
sprig-meta.workspace = true
sprig-settings.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[dev-dependencies]
# Certificates for the SMTP TLS tests' in-process servers.
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
