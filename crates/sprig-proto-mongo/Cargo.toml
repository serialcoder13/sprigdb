[package]
name = "sprig-proto-mongo"
description = "SprigDB: The OP_MSG codec, BSON helpers, SASL and SCRAM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# BSON documents (MIT): raw documents on the wire, owned ones in handlers.
bson = "=2.15.0"
# SCRAM: base64 attributes; HMAC, PBKDF2 and SHA-256 from ring; nonces from
# the OS generator.
base64.workspace = true
getrandom.workspace = true
ring.workspace = true
subtle.workspace = true
# OP_COMPRESSED: snappy (raw), zlib (pure-Rust backend) and zstd.
flate2.workspace = true
snap.workspace = true
zstd.workspace = true
# SprigDB's error registry: the numbers and codeNames of its own codes.
sprig-common.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
hex = "0.4"
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "macros"] }
# Live tests through a real driver (Apache-2.0), without TLS or DNS
# resolution; TLS through rustls (deny.toml bans OpenSSL; webpki-roots'
# CDLA-Permissive-2.0 is allowed for that crate only).
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "zstd-compression", "snappy-compression", "zlib-compression"] }
futures-util = "0.3"
# The unified spec-test runner (tests/spec_live.rs): the JSON test files.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
