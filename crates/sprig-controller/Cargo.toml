[package]
name = "sprig-controller"
description = "SprigDB: the controller role: reconciler runtime, leader election, job dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
futures.workspace = true
gethostname.workspace = true
# Chapter 25: clients of the internal failover services (permits, observers).
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
metrics.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
# Chapter 13: the automatic-indexing store behind `sprigctl index` and
# `sprigctl explain query` (autoindex_admin).
sprig-advisor.workspace = true
sprig-auth.workspace = true
# Chapter 11's balancer loop, decision log and explain calls.
sprig-balancer.workspace = true
sprig-catalog.workspace = true
sprig-cluster.workspace = true
sprig-common.workspace = true
# Chapter 41's logic loop: trigger jobs and schedules (R7 order 5).
sprig-feed.workspace = true
sprig-logic = { path = "../sprig-logic" }
# Chapter 42: the copy worker's subscriptions and the spaces API.
sprig-inherit = { path = "../sprig-inherit" }
# Chapter 45: the stream sequencer jobs (R9).
sprig-streams = { path = "../sprig-streams" }
# Chapter 51 (R9): the sink index the sinks loop reads.
sprig-sinks = { path = "../sprig-sinks" }
sprig-meta.workspace = true
# `mover.max_copies_per_cluster` is sprig-mover's key (chapter 10).
sprig-mover.workspace = true
# The tenant map a move starts from (chapter 15).
sprig-shard.workspace = true
sprig-provision.workspace = true
sprig-settings.workspace = true
# Chapter 07's rewriter and the persona's lexer: validation replays sampled
# statements in the shards' physical names (chapter 13).
sprig-proto-mysql.workspace = true
sprig-sql.workspace = true
# Chapter 12's workload tables: bootstrap migrates them; the rollup loop.
sprig-workload.workspace = true
# Chapter 18's resolver loop (txn_resolver).
sprig-txn.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# tests/live_node_rebuild.rs's test PKI (decision RC2), already in the tree.
rcgen.workspace = true
# tests/live_split.rs builds a cluster access by hand (chapter 20).
sprig-binlog.workspace = true
tracing-subscriber.workspace = true
sprig-meta = { workspace = true, features = ["conformance"] }
# Chapter 25's DC failover simulation (tests/sim_dc_failover.rs).
sprig-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
