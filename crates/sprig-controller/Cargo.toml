[package]
name = "sprig-controller"
description = "SprigDB: the controller role: reconciler runtime, leader election, job dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# Automatic document indexes' doc_indexes rows: their BSON key pattern and
# the document field-column slugs.
bson = "=2.15.0"
sprig-doc = { path = "../sprig-doc" }
axum.workspace = true
futures.workspace = true
gethostname.workspace = true
# Clients of the internal failover services (permits, observers).
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
metrics.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
# The automatic-indexing store behind `sprigctl index` and
# `sprigctl explain query` (autoindex_admin).
sprig-advisor.workspace = true
# Approvals and recommendations.
sprig-approvals.workspace = true
sprig-auth.workspace = true
# The balancer loop, decision log and explain calls.
sprig-balancer.workspace = true
sprig-catalog.workspace = true
sprig-cluster.workspace = true
sprig-common.workspace = true
# The docs pack, its rows and the docs.* settings (docs_loader).
sprig-docs.workspace = true
# The logic loop: trigger jobs and schedules.
sprig-feed.workspace = true
sprig-logic = { path = "../sprig-logic" }
# The copy worker's subscriptions and the spaces API.
sprig-inherit = { path = "../sprig-inherit" }
# The stream sequencer jobs.
sprig-streams = { path = "../sprig-streams" }
# The `mq` catalog module a member under a
# FOR EACH TENANT exchange or queue gets at creation.
sprig-queues = { path = "../sprig-queues" }
# The sink index the sinks loop reads.
sprig-sinks = { path = "../sprig-sinks" }
sprig-meta.workspace = true
# `mover.max_copies_per_cluster` is sprig-mover's key.
sprig-mover.workspace = true
# The tenant map a move starts from.
sprig-shard.workspace = true
sprig-provision.workspace = true
# Residency policies, shared with gateways and workers.
sprig-residency.workspace = true
sprig-settings.workspace = true
# The SQL rewriter and the persona's lexer: validation replays sampled
# statements in the shards' physical names.
sprig-proto-mysql.workspace = true
sprig-sql.workspace = true
# The workload tables: bootstrap migrates them; the rollup loop.
sprig-workload.workspace = true
# The in-doubt transaction resolver loop (txn_resolver).
sprig-txn.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# tests/live_node_rebuild.rs's test PKI, already in the tree.
rcgen.workspace = true
# The approval webhook tests: an HTTPS receiver in process.
rustls.workspace = true
tokio-rustls.workspace = true
# The approvals multi-DC test calls the gateways' gRPC Recommendations.
sprig-api.workspace = true
tonic = { workspace = true, features = ["channel"] }
# tests/live_split.rs builds a cluster access by hand.
sprig-binlog.workspace = true
tracing-subscriber.workspace = true
sprig-meta = { workspace = true, features = ["conformance"] }
# The DC failover simulation (tests/sim_dc_failover.rs).
sprig-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
