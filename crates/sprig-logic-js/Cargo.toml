[package]
name = "sprig-logic-js"
description = "SprigDB: The fallback tier: QuickJS for JavaScript, the kirun crate for KIRun, mlua for Redis Lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
# Chapter 41's native KIRun runtime: Modlix's open-source `kirun` crate (MIT).
kirun.workspace = true
serde_json.workspace = true
sprig-common.workspace = true
# `Sprig.Db.*` statements are checked with sqlparser before they run.
sqlparser.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }
tracing.workspace = true
# `Sprig.Http.Fetch` (the outbound allowlist): HTTP/1.1 over TCP or rustls.
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots = "1"
# JavaScript functions (chapter 41, "The fallback runtime"): QuickJS-ng
# through rquickjs (MIT). `loader` resolves `sprig:db` and nothing else;
# `allocator` lets the runtime count its own heap.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader", "allocator"] }
# Lua functions, and SprigDB's one Lua runtime (chapters 40 and 51 reuse
# it): mlua (MIT) with a vendored Lua 5.1, Redis's dialect. `serialize`
# converts values to and from JSON.
mlua = { version = "=0.12.2", features = ["lua51", "vendored", "serialize"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
