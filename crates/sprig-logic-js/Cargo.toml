[package]
name = "sprig-logic-js"
description = "SprigDB: The fallback tier: QuickJS for JavaScript, the kirun crate for KIRun, mlua for Redis Lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
# Chapter 41's native KIRun runtime: Modlix's open-source `kirun` crate (MIT).
kirun.workspace = true
serde_json.workspace = true
sprig-common.workspace = true
# `Sprig.Db.*` statements are checked with sqlparser before they run.
sqlparser.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }
tracing.workspace = true
# `Sprig.Http.Fetch` (the outbound allowlist): HTTP/1.1 over TCP or rustls.
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
