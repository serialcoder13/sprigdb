role = "dba"
description = "The DBA assistant: tuning, plans, indexes, settings, sharding, policies, logic, approvals."

[[case]]
id = "dba-01"
tags = ["tuning", "index"]
message = "The order history page is slow. What's wrong?"
context = "Database: shop"
world = [
  { tool = "workload", json = { top = [{ id = "fp_7a1", text = "SELECT * FROM orders WHERE customer_id = ? ORDER BY created_at DESC LIMIT ?", calls = 120000, p95_ms = 840, rows_examined_avg = 2100000 }] } },
  { tool = "explain", json = { query_block = { table = { table_name = "orders", access_type = "ALL", rows_examined_per_scan = 2100000, filtered = 0.01, using_filesort = true } } } },
  { tool = "indexes", json = { indexes = [{ name = "PRIMARY", columns = ["id"], unique = true, auto = false }] } },
]
calls = [
  { tool = "workload", args = { db = "shop", hours = 24 } },
  { tool = "explain", args = { db = "shop", sql = "SELECT * FROM orders WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 20" }, has = { sql = ["orders", "customer_id"] }, round = 2 },
  { tool = "indexes", args = { db = "shop", table = "orders" }, round = 2 },
  { tool = "propose_sql", args = { db = "shop", sql = "CREATE INDEX ix_orders_customer_created ON orders (customer_id, created_at)", why = "The history query scans all 2.1M orders and sorts them; this index serves the filter and the order.", estimate = "Online build, a few minutes on 2.1M rows" }, has = { sql = ["index", "customer_id"] } },
]
answer = """
The history query (fp_7a1, 120k calls, p95 840 ms) scans every row of `orders` and sorts: there is no index on `customer_id`.
I proposed an index on `(customer_id, created_at)`; it serves both the filter and the sort. It hasn't run — review it and run it when you're ready.
"""
must = ["customer_id", "index"]
must_any = [["hasn't run", "has not run", "not run"]]
rubric = "Finds the full scan in the plan, explains the missing index on customer_id, proposes a composite index (customer_id, created_at) through propose_sql, and says it hasn't run."

[[case]]
id = "dba-02"
tags = ["tuning", "workload", "fingerprint"]
message = "The monthly sales report got much slower since Tuesday. Can you find out why?"
context = "Database: shop"
world = [
  { tool = "workload", json = { top = [
    { id = "fp_c19", text = "SELECT c.region, SUM(o.total) FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.created_at >= ? GROUP BY c.region", calls = 340, p95_ms = 12400, p95_ms_prev_week = 900, rows_examined_avg = 9800000 },
    { id = "fp_a02", text = "SELECT * FROM customers WHERE id = ?", calls = 410000, p95_ms = 2, rows_examined_avg = 1 },
  ] } },
  { tool = "fingerprint", json = { id = "fp_c19", plans = [
    { first_seen = "2026-11-03", access = "range on ix_orders_created", rows = 410000 },
    { first_seen = "2026-11-10", access = "ALL on orders (full scan), hash join", rows = 9800000 },
  ], latency_history = [{ day = "2026-11-09", p95_ms = 880 }, { day = "2026-11-11", p95_ms = 12100 }] } },
  { tool = "indexes", json = { indexes = [
    { name = "PRIMARY", columns = ["id"], unique = true, auto = false },
    { name = "ix_orders_customer", columns = ["customer_id"], unique = false, auto = false },
  ], recent_drops = [{ name = "ix_orders_created", dropped = "2026-11-10", by = "user ops_admin" }] } },
]
calls = [
  { tool = "workload", args = { db = "shop", hours = 168 } },
  { tool = "fingerprint", args = { id = "fp_c19" } },
  { tool = "indexes", args = { db = "shop", table = "orders" } },
  { tool = "propose_sql", args = { db = "shop", sql = "CREATE INDEX ix_orders_created ON orders (created_at)", why = "The report's plan switched to a full scan on 10 Nov, when ix_orders_created was dropped; restoring it brings back the range scan.", estimate = "Online build over 9.8M rows, several minutes" }, has = { sql = ["created_at"] } },
]
answer = """
The report's fingerprint fp_c19 went from p95 ~0.9 s to ~12 s on 10 Nov. Its plan changed the same day from a range scan on `ix_orders_created` to a full scan of `orders`, because that index was dropped on 10 Nov.
I proposed recreating the index on `orders (created_at)`. It hasn't run; review it and run it in a quiet period.
"""
must = ["fp_c19", "created_at", "dropped"]
must_any = [["hasn't run", "has not run", "not run"]]
rubric = "Finds the regressed fingerprint, connects the plan change to the dropped ix_orders_created index, proposes recreating it with propose_sql, and says the proposal hasn't run."

[[case]]
id = "dba-03"
tags = ["tuning", "index", "covering"]
message = "Our dashboard's order status counts query runs thousands of times an hour and examines way too many rows. Can it be cheaper?"
context = "Database: shop"
world = [
  { tool = "workload", json = { top = [{ id = "fp_5d0", text = "SELECT status, COUNT(*) FROM orders WHERE merchant_id = ? GROUP BY status", calls = 52000, p95_ms = 310, rows_examined_avg = 48000, rows_returned_avg = 5 }] } },
  { tool = "explain", json = { query_block = { table = { table_name = "orders", access_type = "ref", key = "ix_orders_merchant", used_key_parts = ["merchant_id"], rows_examined_per_scan = 48000, using_index = false, using_temporary = true } } } },
]
calls = [
  { tool = "workload", args = { db = "shop", hours = 24 } },
  { tool = "explain", args = { db = "shop", sql = "SELECT status, COUNT(*) FROM orders WHERE merchant_id = 17 GROUP BY status" }, has = { sql = ["merchant_id", "status"] } },
  { tool = "propose_sql", args = { db = "shop", sql = "CREATE INDEX ix_orders_merchant_status ON orders (merchant_id, status)", why = "Lets the count be answered from the index alone, without reading 48k rows per call.", estimate = "Online build; replaces lookups of full rows" }, has = { sql = ["merchant_id", "status"] } },
]
answer = """
fp_5d0 runs 52k times a day and reads ~48k rows per call through `ix_orders_merchant`, then groups in a temporary table.
A covering index on `(merchant_id, status)` lets MariaDB count from the index alone. I proposed it; it has not run. Once it exists, `ix_orders_merchant` becomes redundant and can be dropped later.
"""
must = ["merchant_id, status", "covering"]
must_any = [["hasn't run", "has not run", "not run"]]
rubric = "Uses workload and explain to show the per-call row cost, proposes a covering index (merchant_id, status) via propose_sql, notes the old single-column index becomes redundant, says it hasn't run."

[[case]]
id = "dba-04"
tags = ["tuning", "workload", "app-pattern"]
message = "The database CPU is high but no single query looks slow. What's going on?"
context = "Database: shop"
world = [
  { tool = "workload", json = { top = [
    { id = "fp_e71", text = "SELECT * FROM order_items WHERE order_id = ?", calls = 4100000, p95_ms = 3, rows_examined_avg = 4, total_time_s = 9800 },
    { id = "fp_1b3", text = "SELECT * FROM orders WHERE customer_id = ? ORDER BY id DESC LIMIT ?", calls = 82000, p95_ms = 4, total_time_s = 210 },
  ] } },
]
calls = [
  { tool = "workload", args = { db = "shop", hours = 24 } },
]
answer = """
Nothing is slow per call, but fp_e71 (`SELECT * FROM order_items WHERE order_id = ?`) ran 4.1M times in 24 hours — about 50 calls per order listing. That is an N+1 pattern in the application: it fetches items one order at a time.
Fetch the items for all orders on a page in one query (`WHERE order_id IN (...)`) or with a join. An index won't help; each call already uses one.
"""
must = ["fp_e71", "N+1"]
must_any = [["IN (", "join"]]
must_not = ["CREATE INDEX"]
rubric = "Spots the very high call count of a cheap per-order query (N+1), recommends batching with IN or a join in the application, and does not propose an index."

