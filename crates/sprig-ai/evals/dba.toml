Use plain `EXPLAIN` for what MariaDB does on one shard. See: Read EXPLAIN FORMAT=SPRIG (performance/query-plans#read-explain-formatsprig).
"""
must = ["single-shard", "scatter", "gather"]
cite = true
rubric = "Explains FORMAT=SPRIG from the docs (single-shard vs scatter, shards touched, gateway operators), contrasts with plain EXPLAIN, cites the page."

