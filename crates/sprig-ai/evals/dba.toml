[[case]]
id = "dba-14"
tags = ["settings", "reads", "proposal"]
message = "Users complain they don't see their own edits right after saving. We use the shop database."
world = [
  { tool = "settings", json = { settings = [
    { key = "reads.routing", value = "auto", source = "global default", allowed = ["auto", "writer", "replica"], meaning = "auto sends reads to replicas within reads.max_replica_lag_ms unless the session needs its own writes" },
    { key = "reads.causal_scope", value = "tenant_gateway", source = "global default", meaning = "causal reads apply per tenant and gateway; sessions on other gateways may read stale replicas" },
  ] } },
  { tool = "search_docs", json = { hits = [{ page = "performance/read-routing", heading = "Read your own writes", text = "With reads.routing = auto, a session reads its own writes. Across gateways, use reads.routing = writer for the database, or keep users on one gateway." }] }, sources = [{ kind = "docs", title = "Read your own writes", reference = "performance/read-routing#read-your-own-writes" }] },
]
calls = [
  { tool = "settings", args = { key = "reads.", scope = "database" } },
  { tool = "search_docs", args = { query = "read your own writes replica routing", audience = "dba" }, has = { query = ["read"] }, round = 1 },
  { tool = "propose_sql", args = { db = "shop", sql = "ALTER DATABASE shop SPRIG SET (reads.routing = 'writer')", why = "Reads go to the writer, so a save is visible at once on any gateway.", estimate = "More load on the writer; replicas serve no reads for shop" }, has = { sql = ["reads.routing", "writer"] } },
]
answer = """
`reads.routing` is `auto`: reads can go to a replica, and causal reads only hold per gateway (`reads.causal_scope = tenant_gateway`), so a user whose next request lands on another gateway may read a lagging replica.
Option: route shop's reads to the writer. I proposed `ALTER DATABASE shop SPRIG SET (reads.routing = 'writer')`; it has not run. It adds read load on the writer. See: Read your own writes (performance/read-routing#read-your-own-writes).
"""
must = ["reads.routing", "writer", "replica"]
must_any = [["hasn't run", "has not run", "not run"]]
cite = true
rubric = "Reads the reads.* settings, explains replica lag across gateways, proposes ALTER DATABASE shop SPRIG SET (reads.routing = 'writer') with its trade-off, cites read-routing docs, says it hasn't run."

