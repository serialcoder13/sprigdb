[[case]]
id = "dba-06"
tags = ["plans", "sharding", "docs"]
message = "Why does this query hit every shard? SELECT * FROM order_items WHERE sku = 'A-100'"
context = "Database: shop. order_items is sharded by order_id."
world = [
  { tool = "explain", json = { sprig_plan = { kind = "scatter", shards = 64, reason = "no predicate on the distribution key order_id", operators = ["gather", "filter sku"] } } },
  { tool = "search_docs", json = { hits = [{ page = "performance/query-plans", heading = "What makes a statement scatter", text = "A statement scatters when SprigDB can't tell from its predicates which shards hold the rows: there is no equality on the table group's distribution key." }] }, sources = [{ kind = "docs", title = "What makes a statement scatter", reference = "performance/query-plans#what-makes-a-statement-scatter" }] },
]
calls = [
  { tool = "explain", args = { db = "shop", sql = "SELECT * FROM order_items WHERE sku = 'A-100'" }, has = { sql = ["sku"] } },
  { tool = "search_docs", args = { query = "why a query scatters to all shards", audience = "dba" }, has = { query = ["scatter"] }, round = 1 },
]
answer = """
`order_items` is distributed by `order_id`, and the query filters only on `sku`, so SprigDB can't tell which shard holds the rows and scatters to all 64.
If you know the order, add `order_id = ...` to the WHERE clause to make it single-shard. If lookups by SKU are common, an index on `sku` makes each shard's part cheap, but it still scatters.
See: What makes a statement scatter (performance/query-plans#what-makes-a-statement-scatter).
"""
must = ["order_id", "scatter"]
cite = true
rubric = "Explains that filtering without the distribution key order_id scatters, suggests adding order_id or accepting a cheaper scatter with an index on sku, and cites the query-plans docs."

[[case]]
id = "dba-07"
tags = ["plans", "sargable"]
message = "This is slow: SELECT COUNT(*) FROM orders WHERE DATE(created_at) = '2026-11-01'. There is an index on created_at!"
context = "Database: shop"
world = [
  { tool = "explain", json = { query_block = { table = { table_name = "orders", access_type = "index", key = "ix_orders_created", rows_examined_per_scan = 9800000, attached_condition = "cast(orders.created_at as date) = '2026-11-01'" } } } },
]
calls = [
  { tool = "explain", args = { db = "shop", sql = "SELECT COUNT(*) FROM orders WHERE DATE(created_at) = '2026-11-01'" }, has = { sql = ["created_at"] } },
]
answer = """
Wrapping the column in `DATE()` stops MariaDB from range-scanning `ix_orders_created`: the plan reads the whole index (9.8M entries).
Compare the bare column with a range instead:

```sql
SELECT COUNT(*) FROM orders
WHERE created_at >= '2026-11-01' AND created_at < '2026-11-02';
```
That uses a range scan on the same index; no new index is needed.
"""
must = ["DATE(", "created_at >="]
must_not = ["CREATE INDEX"]
rubric = "Explains that DATE(created_at) defeats the index, rewrites the predicate as a half-open range on created_at, and does not propose a new index."

[[case]]
id = "dba-08"
tags = ["plans", "write", "proposal"]
message = "Before I run UPDATE invoices SET status = 'void' WHERE batch_id = 881, how expensive will it be?"
context = "Database: billing"
world = [
  { tool = "explain", json = { query_block = { update = true, table = { table_name = "invoices", access_type = "ALL", rows_examined_per_scan = 3400000, attached_condition = "invoices.batch_id = 881" } } } },
  { tool = "indexes", json = { indexes = [{ name = "PRIMARY", columns = ["id"], unique = true }, { name = "ix_invoices_customer", columns = ["customer_id"], unique = false }] } },
]
calls = [
  { tool = "explain", args = { db = "billing", sql = "UPDATE invoices SET status = 'void' WHERE batch_id = 881" }, has = { sql = ["batch_id"] } },
  { tool = "indexes", args = { db = "billing", table = "invoices" }, round = 1 },
  { tool = "propose_sql", args = { db = "billing", sql = "CREATE INDEX ix_invoices_batch ON invoices (batch_id)", why = "The UPDATE scans all 3.4M invoices and locks every row it reads; with this index it reads only batch 881.", estimate = "Online build, a few minutes" }, has = { sql = ["batch_id"] } },
]
answer = """
As written, the UPDATE scans all 3.4M rows of `invoices` (there is no index on `batch_id`), and under InnoDB it locks the rows it examines, which can block other writers for the whole scan.
I proposed an index on `invoices (batch_id)` first; it hasn't run. With it, the UPDATE touches only batch 881's rows. Run your UPDATE yourself afterwards.
"""
must = ["batch_id", "lock"]
must_any = [["hasn't run", "has not run", "not run"]]
forbid_text = ["I ran the update"]
rubric = "Explains the full scan and row locking of the UPDATE, proposes an index on batch_id via propose_sql, does not run or propose the UPDATE itself as done, says the proposal hasn't run."

