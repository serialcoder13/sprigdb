  { tool = "search_docs", json = { hits = [{ page = "sql/sharding", heading = "AUTO_INCREMENT", text = "Inserts into a sharded table take AUTO_INCREMENT values from per-table ID blocks that every gateway shares. Values are unique across shards but not gap-free and not strictly ordered across gateways." }] }, sources = [{ kind = "docs", title = "AUTO_INCREMENT", reference = "sql/sharding#auto_increment" }] },
]
calls = [
  { tool = "search_docs", args = { query = "AUTO_INCREMENT on sharded tables", audience = "dba" }, has = { query = ["auto_increment"] } },
]
answer = """
No. On a sharded table, AUTO_INCREMENT values come from shared ID blocks: unique across shards, but not gap-free and not strictly ordered across gateways.
If the app needs gap-free numbers (invoice numbers, say), keep a separate counter for that; don't rely on the id. If it only needs uniqueness, nothing changes. See: AUTO_INCREMENT (sql/sharding#auto_increment).
"""
must = ["gap-free", "unique"]
cite = true
rubric = "States from the docs that sharded AUTO_INCREMENT is unique but neither gap-free nor strictly ordered, suggests a separate counter if gap-free numbers are needed, cites the docs."

