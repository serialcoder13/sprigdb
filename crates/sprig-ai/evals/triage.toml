role = "triage"
description = "Screening administration intake: noise (expected, at baseline, planned or client-side) or needs_advice (system faults, spikes, critical codes, data safety)."

[[case]]
id = "triage-01"
tags = ["baseline", "client"]
message = """
Incident fingerprint 0129: code 1205 (ER_LOCK_WAIT_TIMEOUT), component gateway, span sql.execute.
Count: 3 in the last hour; 7-day baseline 2.8 per hour.
Topology: 2 DCs, 6 gateways, 4 clusters. Version 1.4.2.
"""
label = "noise"
rubric = "At its usual rate and not critical: an application's lock waits, not a system fault."

