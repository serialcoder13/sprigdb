role = "data"
description = "The data specialist: questions to read-only SQL, the glossary, shape-only results when sharing is off."

[[case]]
id = "data-01"
tags = ["sql", "sharing-off"]
message = "How much revenue did we make per region last month?"
context = "Database: shop"
glossary = [{ term = "revenue", definition = "Sum of order totals, excluding refunded orders.", sql = "SUM(total) WHERE status <> 'refunded'" }]
world = [
  { tool = "describe", json = { table = "orders", columns = [{ name = "id", type = "bigint" }, { name = "region", type = "varchar(16)" }, { name = "total", type = "decimal(12,2)" }, { name = "status", type = "varchar(16)" }, { name = "created_at", type = "datetime" }] } },
  { tool = "run_query", rows = { columns = [["region", "varchar"], ["revenue", "decimal"]], rows = [["EMEA", 182340.55], ["APAC", 99120.10]], row_count = 2 } },
]
calls = [
  { tool = "describe", args = { db = "shop", table = "orders" } },
  { tool = "run_query", args = { db = "shop", sql = "SELECT region, SUM(total) AS revenue FROM orders WHERE status <> 'refunded' AND created_at >= '2026-10-01' AND created_at < '2026-11-01' GROUP BY region", limit = 100 }, has = { sql = ["refunded", "group by"] } },
]
answer = """
Data sharing is off, so I only saw the result's shape: two regions came back. Here is the query — it follows the glossary's revenue (refunded orders excluded):

```sql
SELECT region, SUM(total) AS revenue FROM orders
WHERE status <> 'refunded' AND created_at >= '2026-10-01' AND created_at < '2026-11-01'
GROUP BY region
```
Run it to see the numbers.
"""
must = ["refunded", "group by"]
must_not = ["182340"]
rubric = "Uses the glossary's revenue definition (excludes refunds), writes a GROUP BY region query for last month, runs it read-only, and since sharing is off reports only the shape and offers the query instead of numbers."
