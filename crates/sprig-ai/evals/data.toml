  { tool = "search_docs", json = { hits = [{ page = "sql/search-and-vectors", heading = "Full-text queries", text = "Create a search index with CREATE SEARCH INDEX ... ON table (columns), then query it with MATCH (cols) AGAINST ('words') or sprig_search(). MySQL FULLTEXT DDL is accepted too." }] }, sources = [{ kind = "docs", title = "Search and vectors in SQL", reference = "sql/search-and-vectors" }] },
]
