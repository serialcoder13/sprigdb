[[case]]
id = "data-45"
tags = ["sql", "cte", "sharing-off"]
message = "Build me a monthly retention cohort table for customers who first ordered in 2026."
context = "Database: shop"
world = [
  { tool = "describe", json = { table = "orders", columns = [{ name = "id", type = "bigint" }, { name = "customer_id", type = "bigint" }, { name = "region", type = "varchar(16)" }, { name = "total", type = "decimal(12,2)" }, { name = "status", type = "varchar(16)" }, { name = "discount", type = "decimal(5,2)" }, { name = "created_at", type = "datetime" }, { name = "shipped_at", type = "datetime" }], comment = "Status values: new, paid, shipped, refunded, cancelled. total is in EUR." } },
  { tool = "run_query", rows = { columns = [["cohort", "varchar"], ["month", "varchar"], ["customers", "bigint"]], rows = [["2026-02", "2026-03", 410]], row_count = 66 } },
]
calls = [
  { tool = "describe", args = { db = "shop", table = "orders" } },
  { tool = "run_query", args = { db = "shop", sql = "WITH firsts AS (SELECT customer_id, DATE_FORMAT(MIN(created_at), '%Y-%m') AS cohort FROM orders GROUP BY customer_id), active AS (SELECT DISTINCT customer_id, DATE_FORMAT(created_at, '%Y-%m') AS month FROM orders WHERE created_at >= '2026-01-01') SELECT f.cohort, a.month, COUNT(*) AS customers FROM firsts f JOIN active a ON a.customer_id = f.customer_id WHERE f.cohort >= '2026-01' GROUP BY f.cohort, a.month ORDER BY f.cohort, a.month", limit = 1000 }, has = { sql = ["with", "min(created_at)", "group by f.cohort"] } },
]
answer = '''
Each customer's cohort is the month of their first order; the query then counts, per cohort, how many were active (ordered) in each later month:

```sql
WITH firsts AS (
  SELECT customer_id, DATE_FORMAT(MIN(created_at), '%Y-%m') AS cohort
  FROM orders GROUP BY customer_id),
active AS (
  SELECT DISTINCT customer_id, DATE_FORMAT(created_at, '%Y-%m') AS month
  FROM orders WHERE created_at >= '2026-01-01')
SELECT f.cohort, a.month, COUNT(*) AS customers
FROM firsts f JOIN active a ON a.customer_id = f.customer_id
WHERE f.cohort >= '2026-01'
GROUP BY f.cohort, a.month ORDER BY f.cohort, a.month
```
It returned 66 rows (`cohort`, `month`, `customers`). Data sharing is off, so run it to see the counts; divide each row by its cohort's first month to get retention rates. I can also propose it as a heatmap tile.
'''
must = ["min(created_at)", "cohort", "66 rows"]
must_any = [["sharing is off", "data sharing is off", "ai.share_data"]]
rubric = "Defines cohorts by first-order month with a CTE, counts active customers per cohort and month for 2026 cohorts, reports only the shape, and explains how to read retention."

