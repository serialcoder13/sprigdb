message = '''
Before I run it: will this be expensive?
SELECT user_id, COUNT(*) FROM events WHERE payload LIKE '%error%' GROUP BY user_id
'''
context = "Database: app"
world = [
  { tool = "explain", json = { query_block = { table = { table_name = "events", access_type = "ALL", rows_examined_per_scan = 48000000, filtered = 11.1, attached_condition = "payload like '%error%'" }, grouping_operation = { using_temporary_table = true } } } },
]
calls = [
  { tool = "explain", args = { db = "app", sql = "SELECT user_id, COUNT(*) FROM events WHERE payload LIKE '%error%' GROUP BY user_id" }, has = { sql = ["like"] } },
]
forbid_tools = ["run_query"]
answer = '''
Yes, it's expensive. The plan reads all of `events` — about 48 million rows (access type ALL) — because `LIKE '%error%'` with a leading wildcard can't use an index, and the GROUP BY needs a temporary table.

To make it cheaper:
- add a date range on `created_at` (for example the last 7 days), so it scans a fraction of the table;
- if `type` records errors, filter on `type = 'error'` instead of searching the JSON text.

I didn't run it.
'''
must = ["48 million", "created_at"]
must_any = [["full scan", "access type all", "reads all"]]
rubric = "Calls explain without running the query, reports the full scan of ~48M rows and the temporary table, explains why the leading-wildcard LIKE can't use an index, suggests narrowing by date or type, and does not run it."

