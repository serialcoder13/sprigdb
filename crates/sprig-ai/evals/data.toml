[[case]]
id = "data-04"
tags = ["sql", "window", "sharing-off"]
message = "For each customer, show their running total of spend month by month."
context = "Database: shop"
world = [
  { tool = "describe", json = { table = "orders", columns = [{ name = "id", type = "bigint" }, { name = "customer_id", type = "bigint" }, { name = "region", type = "varchar(16)" }, { name = "total", type = "decimal(12,2)" }, { name = "status", type = "varchar(16)" }, { name = "discount", type = "decimal(5,2)" }, { name = "created_at", type = "datetime" }, { name = "shipped_at", type = "datetime" }], comment = "Status values: new, paid, shipped, refunded, cancelled. total is in EUR." } },
  { tool = "run_query", rows = { columns = [["customer_id", "bigint"], ["month", "varchar"], ["spend", "decimal"], ["running_total", "decimal"]], rows = [[17, "2026-01", 120.5, 120.5]], row_count = 5210 } },
]
calls = [
  { tool = "describe", args = { db = "shop", table = "orders" } },
  { tool = "run_query", args = { db = "shop", sql = "SELECT customer_id, month, spend, SUM(spend) OVER (PARTITION BY customer_id ORDER BY month) AS running_total FROM (SELECT customer_id, DATE_FORMAT(created_at, '%Y-%m') AS month, SUM(total) AS spend FROM orders GROUP BY customer_id, DATE_FORMAT(created_at, '%Y-%m')) m ORDER BY customer_id, month", limit = 1000 }, has = { sql = ["over (partition by customer_id order by month)"] } },
]
answer = '''
I used a window function: monthly spend per customer, then `SUM(...) OVER (PARTITION BY customer_id ORDER BY month)` for the running total. It returned 5,210 rows with columns `customer_id`, `month`, `spend` and `running_total`; data sharing is off, so I didn't see the values.

```sql
SELECT customer_id, month, spend,
       SUM(spend) OVER (PARTITION BY customer_id ORDER BY month) AS running_total
FROM (SELECT customer_id, DATE_FORMAT(created_at, '%Y-%m') AS month, SUM(total) AS spend
      FROM orders GROUP BY customer_id, DATE_FORMAT(created_at, '%Y-%m')) m
ORDER BY customer_id, month
```
'''
must = ["partition by customer_id", "running_total"]
must_any = [["sharing is off", "data sharing is off", "ai.share_data"]]
must_not = ["120.5"]
rubric = "Aggregates spend per customer and month, then a SUM window partitioned by customer and ordered by month; reports the shape (row count, columns) only."

