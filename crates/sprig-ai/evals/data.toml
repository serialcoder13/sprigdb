Two steps, per the docs:

1. Create a search index on the column (this changes the schema, so run it yourself or ask me to propose it):
   ```sql
   CREATE SEARCH INDEX products_description ON products (description);
   ```
2. Query it with `MATCH ... AGAINST`:
   ```sql
   SELECT id, name FROM products WHERE MATCH (description) AGAINST ('waterproof jacket');
   ```
`sprig_search()` gives more control, and MySQL's `FULLTEXT` DDL works too. Source: Search and vectors in SQL (sql/search-and-vectors).
'''
must = ["match", "against", "create search index"]
cite = true
