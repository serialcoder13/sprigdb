[[case]]
id = "admin-01"
tags = ["incident", "replication"]
message = """
Incident fingerprint 9c2e: code 39100 (ER_SPRIG_CLUSTER_UNAVAILABLE), component controller, span cluster.health.
Count: 12 in the last hour; 7-day baseline 0 per hour.
Affected: cluster db-eu-2 holding tenant acme, database shop.
New fingerprint. Replica lag on the cluster's replicas rose from 0.5 s to 48 s before it.
Topology: 2 DCs, 6 gateways, 4 clusters (3 nodes each). Version 1.4.2.
"""
scrub = { tenant = ["acme"], database = ["shop"], host = ["db-eu-2"] }
world = [
  { tool = "search_docs", json = { hits = [{ page = "troubleshooting/failover", heading = "Cluster unavailable", text = "A cluster is marked unavailable when its health probes fail for cluster.health_interval_seconds; long replica lag before it usually means the primary was saturated or a long transaction blocked replication." }] }, sources = [{ kind = "docs", title = "Cluster unavailable", reference = "troubleshooting/failover#cluster-unavailable" }] },
  { tool = "metrics_trend", json = { name = "sprig_backend_replica_lag_seconds", days = [{ day = "2026-11-12", p95 = 0.4 }, { day = "2026-11-13", p95 = 0.5 }, { day = "2026-11-14", p95 = 48.0 }] } },
]
calls = [
  { tool = "search_docs", args = { query = "cluster unavailable replica lag", audience = "operator" }, has = { query = ["unavailable"] } },
  { tool = "metrics_trend", args = { name = "sprig_backend_replica_lag_seconds", days = 7 }, round = 1 },
  { tool = "propose_recommendation", args = { kind = "ai_incident_advice", subject = "cluster unavailable after replica lag", body = "Check the primary for a long transaction or saturation; then the cluster's probes." }, has = { body = ["primary"] } },
]
answer = """
**Cause:** the cluster's replicas fell 48 s behind today (p95 0.5 s before), then its health probes failed: most likely the primary was saturated or a long transaction blocked replication.

**Steps:**
1. Check the primary for long-running transactions and its CPU and disk.
2. Check the cluster's health probes and node logs.
3. Watch sprig_backend_replica_lag_seconds return to normal.

I filed this as advice in the approvals inbox; it changes nothing by itself. Docs: Cluster unavailable (troubleshooting/failover#cluster-unavailable).
"""
must = ["cause", "steps", "primary"]
must_any = [["long transaction", "long-running transaction", "saturat"]]
cite = true
rubric = "Links the lag spike to the outage, names a likely cause (long transaction or a saturated primary), gives ordered steps, files advice, cites the failover docs, names no tenant, database or host."

