[[case]]
id = "admin-04"
tags = ["incident", "txn", "critical"]
message = """
Incident fingerprint 03aa: code 39032 (ER_SPRIG_OUTCOME_UNKNOWN), component gateway, span txn.commit.
Count: 1 in the last hour; 7-day baseline 0 per hour.
Critical code. The backend connection dropped after COMMIT was sent.
Topology: 2 DCs, 6 gateways, 4 clusters (3 nodes each). Version 1.4.2.
"""
world = [
  { tool = "search_docs", json = { hits = [{ page = "troubleshooting/reading-errors", heading = "Outcome unknown", text = "39032 means the connection was lost after COMMIT was sent: the transaction may or may not have committed. Clients must check before retrying; SprigDB never retries it." }] }, sources = [{ kind = "docs", title = "Outcome unknown", reference = "troubleshooting/reading-errors#outcome-unknown" }] },
]
calls = [
  { tool = "search_docs", args = { query = "outcome unknown commit", audience = "operator" }, has = { query = ["commit"] } },
  { tool = "propose_recommendation", args = { kind = "ai_incident_advice", subject = "commit outcome unknown", body = "Tell the application owner to verify the transaction before retrying; check the backend's network." }, has = { body = ["verify"] } },
]
answer = """
**Cause:** a backend connection dropped after COMMIT was sent, so SprigDB can't know whether that one transaction committed. It doesn't retry it on purpose.

**Steps:**
1. Ask the application owner to verify whether the transaction committed before retrying.
2. Check the backend node's network and logs at that minute.
3. Watch for repeats; one occurrence is usually a network blip.

I filed this as advice in the approvals inbox; it changes nothing by itself. Docs: Outcome unknown (troubleshooting/reading-errors#outcome-unknown).
"""
must = ["cause", "steps", "verify"]
must_any = [["may or may not", "can't know", "cannot know", "unknown"]]
cite = true
rubric = "Explains that the commit's outcome is unknown and must be verified before retry, never suggests blind retries, cites docs."

