2. Only if MariaDB's max_connections has room, raise backend.max_conns_per_node.
3. Watch sprig_backend_pool_wait_seconds.

I filed this as advice in the approvals inbox; it changes nothing by itself. Docs: Connection limits (troubleshooting/connections#connection-limits).
