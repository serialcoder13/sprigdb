  { tool = "settings", json = { settings = [{ key = "backend.max_conns_per_node", value = 200, source = "default" }, { key = "backend.acquire_timeout_ms", value = 2000, source = "default" }] } },
  { tool = "metrics_trend", json = { name = "sprig_backend_pool_wait_seconds", days = [{ day = "2026-11-13", p95 = 0.01 }, { day = "2026-11-14", p95 = 1.9 }] } },
]
calls = [
  { tool = "search_docs", args = { query = "backend pool timeout", audience = "operator" }, has = { query = ["pool"] } },
  { tool = "settings", args = { key = "backend." }, round = 1 },
  { tool = "metrics_trend", args = { name = "sprig_backend_pool_wait_seconds", days = 7 }, round = 1 },
  { tool = "propose_recommendation", args = { kind = "ai_incident_advice", subject = "backend pool timeouts", body = "Find slow statements holding connections before raising backend.max_conns_per_node." }, has = { body = ["max_conns_per_node"] } },
]
answer = """
**Cause:** every backend connection stays busy: pool waits went from 10 ms to 1.9 s p95 today, with the pool at its default of 200 per node. Slow statements holding connections are the usual reason.

**Steps:**
