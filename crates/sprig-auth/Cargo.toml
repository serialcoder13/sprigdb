[package]
name = "sprig-auth"
description = "SprigDB: Principals, verifiers, privileges and backend-grant derivation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test helpers for other crates' tests (the gateway, sprigctl): migrating a
# test catalog and creating users with passwords. See `sprig_auth::testing`.
testing = []

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
# Token signatures and refresh tokens (chapter 14 step 12) are base64url.
base64.workspace = true
getrandom.workspace = true
metrics.workspace = true
mysql_async.workspace = true
# SCRAM verifiers (chapter 14): PBKDF2, HMAC and SHA-256/512.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
# Chapter 08: "sprig-auth depends on sprig-catalog, never the reverse" (both
# layer 2). Not yet a workspace dependency, so by path.
sprig-catalog.workspace = true
sprig-common.workspace = true
sprig-meta.workspace = true
sprig-proto-mysql.workspace = true
sprig-provision.workspace = true
sprig-settings.workspace = true
# SASLprep (RFC 4013) of SCRAM-SHA-256 passwords.
stringprep.workspace = true
subtle.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
# Token session ids are UUIDv7 (chapter 14, `token_sessions.session_id`).
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
sprig-meta = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["test-util", "io-util"] }

[lints]
workspace = true
