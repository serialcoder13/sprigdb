[package]
name = "sprig-proto-kafka"
description = "SprigDB: The Kafka wire protocol codec and broker front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# SASL PLAIN and SCRAM: base64 for SCRAM's attributes; HMAC, PBKDF2 and
# SHA-256/512 from ring; nonces from the OS generator.
base64.workspace = true
bytes.workspace = true
# Record batch compression: gzip (pure-Rust backend), snappy, LZ4 frames
# and zstd.
flate2.workspace = true
getrandom.workspace = true
lz4_flex.workspace = true
metrics.workspace = true
ring.workspace = true
sprig-common.workspace = true
snap.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
# xxh3_64 for rendezvous hashing of partition leaders and coordinators.
twox-hash.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true
# The live test's TLS client.
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "test-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true
