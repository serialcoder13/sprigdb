sprig-proto-mysql.workspace = true
# The `workload.*` keys (chapter 12, "Configuration").
sprig-settings.workspace = true
# The persona-aware lexer (chapter 07): fingerprints reuse its tokens.
sprig-sql.workspace = true
sqlparser.workspace = true
tokio.workspace = true
tracing.workspace = true
# xxh3_64 for fingerprint ids (chapter 12).
twox-hash.workspace = true
