[package]
name = "sprig-workload"
description = "SprigDB: Fingerprinting, statistics and the workload store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The recorder's settings, swapped whole when a `workload.*` key changes.
arc-swap.workspace = true
async-trait.workspace = true
metrics.workspace = true
# The workload tables in the tenant catalog.
mysql_async.workspace = true
# AES-256-GCM and HKDF-SHA256 for sealed parameter samples.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
# Owners' crates depend on sprig-catalog, never the reverse.
# The workload tables are this crate's migration module.
sprig-catalog.workspace = true
sprig-common.workspace = true
sprig-proto-mysql.workspace = true
# The `workload.*` keys.
sprig-settings.workspace = true
# The persona-aware lexer: fingerprints reuse its tokens.
sprig-sql.workspace = true
sqlparser.workspace = true
tokio.workspace = true
tracing.workspace = true
# xxh3_64 for fingerprint ids.
twox-hash.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
sprig-sql.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
