[package]
name = "sprig-gateway"
description = "SprigDB: the gateway role"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Sql.Check for Studio: syntax errors with positions.
sqlparser.workspace = true
arc-swap = "1.7"
async-trait.workspace = true
# HTTP on 8080/8443 and the peer service on 7403: hyper-util's server
# serves HTTP/1.1 and h2 on one connection; tonic runs the gRPC services; base64 for Basic credentials.
base64.workspace = true
bytes.workspace = true
futures.workspace = true
gethostname.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2", "client-legacy"] }
prost.workspace = true
prost-types.workspace = true
sprig-api.workspace = true
tonic = { workspace = true, features = ["codegen", "router", "channel", "tls-ring"] }
metrics.workspace = true
mysql_async.workspace = true
# Rows for the lookup sessions on the router's connections.
mysql_common.workspace = true
# Sealed workload samples: randomness for nonces.
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-auth.workspace = true
# Recommendations in SQL.
sprig-approvals.workspace = true
# The balancer's load report and write sketches.
sprig-balancer.workspace = true
# Logic declarations.
sprig-logic = { path = "../sprig-logic" }
# MongoDB's server-side JavaScript: `sprig_logic_js::mongo`.
sprig-logic-js.workspace = true
sprig-catalog.workspace = true
sprig-cluster.workspace = true
sprig-common.workspace = true
# Docs search: the pack's tables, fusion and settings; the query embedding
# model, run on a small rayon pool of its own.
sprig-docs.workspace = true
sprig-embed.workspace = true
rayon.workspace = true
sprig-meta.workspace = true
sprig-proto-mysql.workspace = true
sprig-provision.workspace = true
sprig-settings.workspace = true
# The tenant map a cutover holds and flips.
sprig-shard.workspace = true
# The router.
sprig-router.workspace = true
# The session's backend connection as a transaction branch.
sprig-txn.workspace = true
sprig-sql.workspace = true
# Typed tables and record hierarchies.
sprig-types = { path = "../sprig-types" }
# Event streams in tenant sessions.
sprig-streams = { path = "../sprig-streams" }
# Sinks and connections.
sprig-sinks = { path = "../sprig-sinks" }
# The Kafka codec and broker on 9092.
sprig-proto-kafka = { path = "../sprig-proto-kafka" }
# AMQP 0-9-1 and 1.0 on 5672 and 5671.
sprig-proto-amqp = { path = "../sprig-proto-amqp" }
# The MongoDB codec and SCRAM, the document
# engine, and BSON (MIT).
sprig-proto-mongo = { path = "../sprig-proto-mongo" }
sprig-doc = { path = "../sprig-doc" }
# Full-text search.
sprig-search.workspace = true
# The Redis front end over the key-value engine.
sprig-redis = { path = "../sprig-redis" }
sprig-proto-redis = { path = "../sprig-proto-redis" }
sprig-kv = { path = "../sprig-kv" }
# The Vectors API, and regions for its geo filters.
sprig-vector = { path = "../sprig-vector" }
sprig-geo = { path = "../sprig-geo" }
# The Analytics API.
sprig-dim = { path = "../sprig-dim" }
# Change streams over the change feed.
sprig-feed.workspace = true
# Studio's embedded files and serving.
sprig-studio = { path = "../sprig-studio" }
sprig-binlog.workspace = true
bson = "=2.15.0"
getrandom.workspace = true
# The queue engine behind AMQP.
sprig-queues = { path = "../sprig-queues" }
# Graphs and the Bolt listener on 7687.
sprig-graph = { path = "../sprig-graph" }
sprig-proto-bolt = { path = "../sprig-proto-bolt" }
uuid.workspace = true
# WebSocket change streams' Sec-WebSocket-Accept.
sha1.workspace = true
# Hierarchical data inheritance.
sprig-inherit = { path = "../sprig-inherit" }
# Workload fingerprints, the recorder, the flusher and samples.
sprig-workload.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
twox-hash.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Classifying HTTP/2 errors in the listener-change tests (a stream the
# server's GOAWAY refused).
h2 = "0.4"
rcgen.workspace = true
# Trace assertions in observe's tests.
tracing-subscriber.workspace = true
sprig-testkit.workspace = true
sprig-meta = { workspace = true, features = ["conformance"] }
# The live test of triggers on queues declares its queue over AMQP 0-9-1
# (lapin, MIT; already a test client of sprig-queues).
lapin = { version = "=4.12.3", default-features = false, features = ["default-runtime"] }
# The live test of logic calls from MongoDB and Redis: the drivers the
# MongoDB and Redis suites use, same versions and features.
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "zstd-compression", "snappy-compression", "zlib-compression"] }
redis = { version = "=0.27.6", default-features = false, features = ["aio", "tokio-comp"] }

[lints]
workspace = true
