[package]
name = "sprig-gateway"
description = "SprigDB: the gateway role"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Sql.Check (chapter 37, "APIs for Studio"): syntax errors with positions.
sqlparser.workspace = true
arc-swap = "1.7"
async-trait.workspace = true
# HTTP on 8080/8443 and the peer service on 7403 (chapter 04 steps 4 and
# 10, chapter 37): hyper-util's server serves HTTP/1.1 and h2 on one
# connection; tonic runs the gRPC services; base64 for Basic credentials.
base64.workspace = true
bytes.workspace = true
futures.workspace = true
gethostname.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2", "client-legacy"] }
prost.workspace = true
prost-types.workspace = true
sprig-api.workspace = true
tonic = { workspace = true, features = ["codegen", "router", "channel", "tls-ring"] }
metrics.workspace = true
mysql_async.workspace = true
# Rows for chapter 19's lookup sessions on the router's connections.
mysql_common.workspace = true
# Sealed workload samples (chapter 12): randomness for nonces.
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-auth.workspace = true
# Chapter 52: recommendations in SQL.
sprig-approvals.workspace = true
# Chapter 11's load report and chapter 20's write sketches.
sprig-balancer.workspace = true
# Logic declarations (chapter 41, R7).
sprig-logic = { path = "../sprig-logic" }
# MongoDB's server-side JavaScript (M4): `sprig_logic_js::mongo`.
sprig-logic-js.workspace = true
sprig-catalog.workspace = true
sprig-cluster.workspace = true
sprig-common.workspace = true
sprig-meta.workspace = true
sprig-proto-mysql.workspace = true
sprig-provision.workspace = true
sprig-settings.workspace = true
# The tenant map a cutover holds and flips (chapters 10 and 15).
sprig-shard.workspace = true
# The router (chapter 17, R1).
sprig-router.workspace = true
# Chapter 18: the session's backend connection as a transaction branch.
sprig-txn.workspace = true
sprig-sql.workspace = true
# Typed tables and record hierarchies (chapter 32, R6).
sprig-types = { path = "../sprig-types" }
# Chapter 45: event streams in tenant sessions (R9).
sprig-streams = { path = "../sprig-streams" }
# Chapter 51: sinks and connections (R9).
sprig-sinks = { path = "../sprig-sinks" }
# Chapter 45: the Kafka codec and broker on 9092 (R9).
sprig-proto-kafka = { path = "../sprig-proto-kafka" }
# Chapter 50: AMQP 0-9-1 and 1.0 on 5672 and 5671 (R9).
sprig-proto-amqp = { path = "../sprig-proto-amqp" }
# Chapter 30 and 31 (R5): the MongoDB codec and SCRAM, the document
# engine, and BSON (MIT).
sprig-proto-mongo = { path = "../sprig-proto-mongo" }
sprig-doc = { path = "../sprig-doc" }
# Full-text search (chapter 39, R5 round 5).
sprig-search.workspace = true
# The Redis front end (chapter 40, R6) over the key-value engine (chapter 33).
sprig-redis = { path = "../sprig-redis" }
sprig-proto-redis = { path = "../sprig-proto-redis" }
sprig-kv = { path = "../sprig-kv" }
# Chapter 34 (R6): the Vectors API; chapter 36: regions for its geo filters.
sprig-vector = { path = "../sprig-vector" }
sprig-geo = { path = "../sprig-geo" }
# Chapter 35 (R6): the Analytics API.
sprig-dim = { path = "../sprig-dim" }
# Change streams over the change feed (chapter 30 step 9).
sprig-feed.workspace = true
# Chapter 44: Studio's embedded files and serving.
sprig-studio = { path = "../sprig-studio" }
sprig-binlog.workspace = true
bson = "=2.15.0"
getrandom.workspace = true
# Chapter 50: the queue engine behind AMQP (R9).
sprig-queues = { path = "../sprig-queues" }
# Chapter 43: graphs and the Bolt listener on 7687 (R8).
sprig-graph = { path = "../sprig-graph" }
sprig-proto-bolt = { path = "../sprig-proto-bolt" }
uuid.workspace = true
# WebSocket change streams' Sec-WebSocket-Accept (chapter 37 step 11).
sha1.workspace = true
# Hierarchical data inheritance (chapter 42, R6).
sprig-inherit = { path = "../sprig-inherit" }
# Chapter 12: fingerprints, the recorder, the flusher and samples.
sprig-workload.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
twox-hash.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Classifying HTTP/2 errors in the listener-change tests (a stream the
# server's GOAWAY refused).
h2 = "0.4"
rcgen.workspace = true
# Trace assertions in observe's tests (chapter 47).
tracing-subscriber.workspace = true
sprig-testkit.workspace = true
sprig-meta = { workspace = true, features = ["conformance"] }
# The live test of triggers on queues declares its queue over AMQP 0-9-1
# (lapin, MIT; already a test client of sprig-queues).
lapin = { version = "=4.12.3", default-features = false, features = ["default-runtime"] }
# The live test of logic calls from MongoDB and Redis (chapter 41, R7):
# the drivers the R5 and R6 suites use, same versions and features.
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "zstd-compression", "snappy-compression", "zlib-compression"] }
redis = { version = "=0.27.6", default-features = false, features = ["aio", "tokio-comp"] }

[lints]
workspace = true
