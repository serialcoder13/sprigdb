[package]
name = "sprig-router"
description = "SprigDB: The distributed planner and executor, and the DataFusion bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
# Analytic reads: joins, aggregates and windows over the shards' rows in the gateway.
datafusion.workspace = true
futures.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-common.workspace = true
# Column definitions of shard results (the MySQL protocol codec).
sprig-proto-mysql.workspace = true
# The `router.*` setting keys.
sprig-settings.workspace = true
# Key normalization, routing_hash, collations.
sprig-shard.workspace = true
# Statement ASTs (sqlparser-rs).
sqlparser.workspace = true
# Parallel shard streams, with backpressure.
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The differential suite talks to the gateway and to a
# reference MariaDB.
mysql_async.workspace = true
# Its LOAD DATA LOCAL INFILE cases hand mysql_async a stream.
futures.workspace = true
proptest.workspace = true
# The suite writes table groups and shard maps as sharding and splits do.
sprig-catalog.workspace = true
sprig-meta.workspace = true
sprig-txn.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
