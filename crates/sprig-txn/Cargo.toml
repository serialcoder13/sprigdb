[dev-dependencies]
# `locate`'s tests keep shard maps in the in-memory store.
sprig-meta.workspace = true
# The deterministic simulation (chapter 46) and the MariaDB model.
sprig-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
