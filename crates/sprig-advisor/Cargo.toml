[package]
name = "sprig-advisor"
description = "SprigDB: The sharding advisor and automatic indexing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# The sprig_advisor_autoindex_* metrics.
metrics.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
# Owners' crates depend on sprig-catalog, never the reverse
# (both layer 2). The automatic-indexing tables are this crate's migration
# module.
sprig-catalog.workspace = true
sprig-common.workspace = true
# Validation connects to the validation node with
# sprig-cluster's probe sessions and reads its profile types.
sprig-cluster.workspace = true
sprig-settings.workspace = true
# Keys, groups, shard maps and `_sprig_rk` (the advisor's first design
# creates groups and back-fills hashes).
sprig-shard.workspace = true
# The shapes candidates are generated from (`sprig-workload::shape`).
sprig-workload.workspace = true
# Document candidates: the field columns and class codes of document
# indexes, so an automatic index is built exactly as `createIndexes` builds
# one.
sprig-doc = { path = "../sprig-doc" }
# Which tables stored code names: the lexer and
# the row-level security swap's table positions.
sprig-sql.workspace = true
tokio.workspace = true
tracing.workspace = true
# xxh3_64 for automatic index names and definition hashes.
twox-hash.workspace = true

[dev-dependencies]
futures.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
