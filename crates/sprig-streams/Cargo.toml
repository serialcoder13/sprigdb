[package]
name = "sprig-streams"
description = "SprigDB: Event streams: storage, retention, change topics, consumer groups and offsets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# Binary Kafka header values in the outbox's headers JSON.
base64.workspace = true
metrics.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-binlog.workspace = true
sprig-catalog.workspace = true
sprig-common.workspace = true
# The sequencer reads the tenant's feed.
sprig-feed.workspace = true
sprig-meta.workspace = true
sprig-settings.workspace = true
# The SQL lexer for the stream statements; sqlparser-rs for the
# reads the gateway rewrites.
sprig-sql.workspace = true
sqlparser.workspace = true
tokio.workspace = true
tracing.workspace = true
# Event ids of Kafka appends (UUIDv7), chosen before the insert so the
# producer can find their offsets.
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
