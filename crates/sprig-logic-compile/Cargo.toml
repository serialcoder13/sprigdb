[package]
name = "sprig-logic-compile"
description = "SprigDB: The JavaScript and KIRun to MariaDB PL/SQL compiler: parser front ends, shared IR, checks and code generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Embedded `Sprig.Db.*` SQL is parsed, checked and re-rendered.
sqlparser.workspace = true
sprig-common.workspace = true
# The JavaScript front end: oxc's
# parser and AST, MIT. 0.135 is the newest release whose MSRV (1.94)
# matches the workspace's.
oxc_allocator = "=0.135.0"
oxc_ast = "=0.135.0"
oxc_parser = { version = "=0.135.0", default-features = false }
oxc_span = "=0.135.0"
oxc_syntax = "=0.135.0"

[dev-dependencies]
# The differential test runs compiled routines on the Compose single node.
mysql_async.workspace = true
tokio = { workspace = true, features = ["rt"] }
# ... and the same definitions on the fallback tier's native KIRun runtime.
async-trait.workspace = true
sprig-logic-js.workspace = true

[lints]
workspace = true
