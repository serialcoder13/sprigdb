[package]
name = "sprig-graph"
description = "SprigDB: Property graphs: catalog, Cypher, GQL and SQL/PGQ front ends, pattern planning and traversal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# Bookmarks: base64url bodies with an HMAC-SHA256 tag (both already in
# the workspace).
base64.workspace = true
# Temporal values and named time zones. Both already in Cargo.lock
# (through sprig-logic); MIT/Apache-2.0.
chrono = "0.4.45"
chrono-tz = "0.10.4"
metrics.workspace = true
mysql_async.workspace = true
# `=~` in Cypher. Already in Cargo.lock (through kirun); MIT/Apache-2.0.
regex = "1.13"
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-catalog.workspace = true
sprig-common.workspace = true
sprig-settings.workspace = true
# Graph hops are router routes: the router plans each
# shard statement from its own map cache's group.
sprig-router.workspace = true
sprig-shard.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Sprig 2PC under graph writes: the distributed-transaction coordinator
# and resolver over plain connections.
sprig-txn = { path = "../sprig-txn" }
# The live Bolt and differential tests' client.
sprig-proto-bolt = { path = "../sprig-proto-bolt" }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }

[lints]
workspace = true
