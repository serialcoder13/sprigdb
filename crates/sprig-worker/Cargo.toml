[package]
name = "sprig-worker"
description = "SprigDB: the worker role"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
gethostname.workspace = true
# node_rebuild calls the nodes' agents.
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
metrics.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
# Runs of triggers on streams and queues go to gateways
# over the peer service.
sprig-api.workspace = true
# Sink owners' row-level security, checked by the worker.
sprig-auth.workspace = true
sprig-binlog.workspace = true
sprig-catalog.workspace = true
sprig-cluster.workspace = true
sprig-common.workspace = true
# The job runtime and the logic jobs.
sprig-controller = { path = "../sprig-controller" }
sprig-feed.workspace = true
# The copy worker (inherit_copy jobs).
sprig-inherit = { path = "../sprig-inherit" }
# The graph mirror applier.
sprig-graph = { path = "../sprig-graph" }
sprig-logic = { path = "../sprig-logic" }
# Stream sequencers.
sprig-streams = { path = "../sprig-streams" }
# Sink tasks.
sprig-sinks = { path = "../sprig-sinks" }
# The key-value sweeper.
sprig-kv = { path = "../sprig-kv" }
# The TTL monitor's deletes.
sprig-doc = { path = "../sprig-doc" }
bson = "=2.15.0"
sprig-workload.workspace = true
sprig-meta.workspace = true
sprig-mover.workspace = true
sprig-settings.workspace = true
sprig-shard.workspace = true
# The XA resolver drains prepared branches at mover cutovers.
sprig-txn.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["codegen", "channel", "tls-ring", "server"] }
# The search role's copies and service.
sprig-search.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
