[package]
name = "sprig-redis"
description = "SprigDB: Redis command execution over the data layer, and pub/sub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
crc32fast.workspace = true
getrandom.workspace = true
sha1.workspace = true
sprig-common.workspace = true
sprig-kv = { path = "../sprig-kv" }
sprig-proto-redis = { path = "../sprig-proto-redis" }
# Lua scripts and functions run on SprigDB's one Lua runtime (chapter 41).
sprig-logic-js.workspace = true
mlua = { version = "=0.12.2", features = ["lua51", "vendored", "serialize"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
mysql_async.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros"] }
# The differential suite's client (BSD-3-Clause), against a reference Redis.
redis = { version = "=0.27.6", default-features = false, features = ["aio", "tokio-comp"] }
# The key-value geo test's oracle: WGS 84 distances (chapter 36).
sprig-geo = { path = "../sprig-geo" }

[lints]
workspace = true
