[package]
name = "sprigdb"
description = "SprigDB: the server binary; the role is a subcommand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
sprig-agent.workspace = true
# The AI assistants' core; linked for its `ai.*` settings until a role uses it.
sprig-ai.workspace = true
sprig-common.workspace = true
sprig-controller.workspace = true
sprig-docs = { path = "../sprig-docs" }
sprig-gateway.workspace = true
sprig-operator.workspace = true
sprig-settings.workspace = true
sprig-worker.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
mimalloc = { workspace = true, optional = true }

[features]
# mimalloc as the global allocator, on by default. `system-alloc` keeps the
# platform allocator (glibc on Linux) even with the default features on.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
system-alloc = []

[lints]
workspace = true
