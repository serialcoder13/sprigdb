[package]
name = "sprig-api"
description = "SprigDB: Protobuf (sprig.v1, sprig.admin.v1), tonic services and REST transcoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
prost.workspace = true
prost-types.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-common.workspace = true
tonic = { workspace = true, features = ["codegen", "router"] }
tonic-prost.workspace = true

[dev-dependencies]
# Code generation is checked in (src/gen/); tests/codegen.rs regenerates it
# with protoc and compares, so building the workspace needs no protoc.
tonic-prost-build.workspace = true

[lints]
workspace = true
