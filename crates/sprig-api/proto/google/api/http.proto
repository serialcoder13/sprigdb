// The subset of googleapis' google/api/http.proto that SprigDB's protos use:
// the HttpRule that maps an RPC to a REST route (chapter 37, "REST
// transcoding"). Field numbers match the original (Apache-2.0, Google LLC),
// so standard tooling reads these annotations unchanged.
syntax = "proto3";

package google.api;

message HttpRule {
  string selector = 1;
  oneof pattern {
    string get = 2;
    string put = 3;
    string post = 4;
    string delete = 5;
    string patch = 6;
    CustomHttpPattern custom = 8;
  }
  string body = 7;
  string response_body = 12;
  repeated HttpRule additional_bindings = 11;
}

message CustomHttpPattern {
  string kind = 1;
  string path = 2;
}
