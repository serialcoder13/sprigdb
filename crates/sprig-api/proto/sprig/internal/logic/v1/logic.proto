// sprig.internal.logic.v1.LogicPeer: a worker asking a gateway to run one
// step of a trigger on a stream or a queue. Served on the peer port 7403
// with the peer service's mutual TLS. Never exposed to clients.
syntax = "proto3";

package sprig.internal.logic.v1;

service LogicPeer {
  // One run: a record of a stream, or the next message of a queue, in one
  // transaction of a session as the trigger's definer.
  rpc RunTrigger(RunTriggerRequest) returns (RunTriggerReply);
  // Statements of a sink task in a session as the sink's owner: a script
  // sink's read-only `db` reads, each in a
  // read-only transaction, and a queue source's sprig.mq_get, mq_ack and
  // mq_nack calls.
  rpc SinkSql(SinkSqlRequest) returns (SinkSqlReply);
}

message RunTriggerRequest {
  // sprig_logic::messages::RunRequest as JSON.
  string request_json = 1;
}

message RunTriggerReply {
  // sprig_logic::messages::RunReply as JSON.
  string reply_json = 1;
}

message SinkSqlRequest {
  // sprig_sinks::peer::SqlRequest as JSON.
  string request_json = 1;
}

message SinkSqlReply {
  // sprig_sinks::peer::SqlReply as JSON.
  string reply_json = 1;
}
