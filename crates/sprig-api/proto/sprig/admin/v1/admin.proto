// sprig.admin.v1: the Admin API (chapter 37), one service per sprigctl
// command group. Every RPC has a REST route under /admin/v1/ (its
// google.api.http rule) and the same JSON body either way.
//
// R0 shape: requests carry the route's path parameters, the REST query
// string and the JSON body; replies carry the REST reply's JSON text. The
// REST face is the reference (sprigctl uses it); gRPC calls reach the same
// implementation, so typed messages can replace the JSON fields later
// without changing behaviour.
syntax = "proto3";

package sprig.admin.v1;

import "google/api/annotations.proto";

// A list call: only the query string (filters, paging).
message ListRequest {
  // The REST query string without '?', for example "prefix=gateway.".
  string query = 1;
}

// A create call: the JSON body.
message BodyRequest {
  // The request body as JSON text.
  string body_json = 1;
  string query = 2;
}

// A call on one named resource.
message NameRequest {
  // The resource: cluster id, DC id, tenant name, setting key, job id or
  // gateway id.
  string name = 1;
  string query = 2;
  string body_json = 3;
}

// A call on a tenant's collection.
message TenantRequest {
  string tenant = 1;
  string query = 2;
  string body_json = 3;
}

// A call on one object of a tenant: an index or a query fingerprint.
message TenantObjectRequest {
  string tenant = 1;
  string name = 2;
  string query = 3;
  string body_json = 4;
}

// The reply: the REST reply's JSON body.
message JsonReply {
  string json = 1;
}

// MariaDB clusters of this DC (chapter 09).
service Clusters {
  rpc RegisterCluster(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/clusters"
      body: "*"
    };
  }
  rpc ListClusters(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/clusters"
    };
  }
  rpc GetCluster(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/clusters/{name}"
    };
  }
  rpc ProbeCluster(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/clusters/{name}:probe"
      body: "*"
    };
  }
  rpc DrainCluster(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/clusters/{name}:drain"
      body: "*"
    };
  }
}

// Data centers (chapter 23).
service DataCenters {
  rpc RegisterDc(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/dcs"
      body: "*"
    };
  }
  rpc ListDcs(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/dcs"
    };
  }
  rpc GetDc(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/dcs/{name}"
    };
  }
}

// Tenants and the tenant tree (chapters 08 and 23).
service Tenants {
  rpc CreateTenant(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants"
      body: "*"
    };
  }
  rpc ListTenants(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants"
    };
  }
  rpc GetTenant(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{name}"
    };
  }
  rpc DeleteTenant(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      delete: "/admin/v1/tenants/{name}"
    };
  }
  // Chapter 14, "Suspension": logins in the subtree fail with 39303, open
  // sessions close, background work waits. The body is {"reason": "..."}.
  rpc SuspendTenant(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{name}:suspend"
      body: "*"
    };
  }
  rpc ResumeTenant(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{name}:resume"
      body: "*"
    };
  }
}

// Tenant users (interim, chapter 14).
service Users {
  rpc CreateUser(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{name}/users"
      body: "*"
    };
  }
}

// Settings at every scope (chapters 08 and 23).
service Settings {
  rpc ListSettingKeys(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/settings"
    };
  }
  rpc GetSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/settings/{name}"
    };
  }
  rpc ExplainSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/settings/{name}:explain"
    };
  }
  rpc SetSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      put: "/admin/v1/settings/{name}"
      body: "*"
    };
  }
  rpc UnsetSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      delete: "/admin/v1/settings/{name}"
    };
  }
  rpc ResetSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/settings/{name}:reset"
      body: "*"
    };
  }
  rpc SetBounds(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/settings/{name}:bounds"
      body: "*"
    };
  }
  rpc LockSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/settings/{name}:lock"
      body: "*"
    };
  }
  rpc UnlockSetting(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/settings/{name}:unlock"
      body: "*"
    };
  }
  rpc TenantSettings(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{name}/settings"
    };
  }
}

// Automatic indexes and recommendations (chapter 13).
service Indexes {
  rpc ListIndexes(TenantRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{tenant}/indexes"
    };
  }
  rpc ListRecommendations(TenantRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{tenant}/recommendations"
    };
  }
  rpc GetIndex(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{tenant}/indexes/{name}"
    };
  }
  rpc Apply(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant}/indexes/{name}:approve"
      body: "*"
    };
  }
  rpc Dismiss(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant}/indexes/{name}:reject"
      body: "*"
    };
  }
  rpc Drop(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant}/indexes/{name}:drop"
      body: "*"
    };
  }
  rpc Freeze(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant}/indexes/{name}:pin"
      body: "*"
    };
  }
  rpc Unfreeze(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant}/indexes/{name}:unpin"
      body: "*"
    };
  }
}

// Why a query got, or didn't get, an index (chapter 13).
service Explain {
  rpc ExplainQuery(TenantObjectRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{tenant}/queries/{name}:explain"
    };
  }
}

// Jobs of the DC tier's scheduler (chapter 23).
service Jobs {
  rpc ListJobs(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/jobs"
    };
  }
  rpc GetJob(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/jobs/{name}"
    };
  }
  rpc CancelJob(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/jobs/{name}:cancel"
      body: "*"
    };
  }
}

// Registered gateways, and draining one (chapter 04).
service Gateways {
  rpc ListGateways(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/gateways"
    };
  }
  rpc GetGateway(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/gateways/{name}"
    };
  }
  rpc DrainGateway(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/gateways/{name}:drain"
      body: "*"
    };
  }
}

// Approvals and recommendations (chapter 52). Ids carry their store:
// "t42.17", "dc.mum1.3", "g.5". Operators call with the admin token (or a
// DC operator's); tenant users call with their own login, and the gateway
// passes their tenant, SPRIG_TENANT_ADMIN and ALTER/INDEX grants to the
// controller as a caller claim, as the REST face /v1/recommendations does.
service Recommendations {
  // Query: tenant, level, kind, state, db, table, min_age_hours, all, limit.
  rpc ListRecommendations(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/recommendations"
    };
  }
  rpc GetRecommendation(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/recommendations/{name}"
    };
  }
  // body_json: {"action": "approve" | "ignore" | "snooze" | "reopen" |
  // "comment", ...} as chapter 52's action bodies.
  rpc ActOnRecommendation(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/recommendations/{name}:act"
      body: "*"
    };
  }
  rpc BulkAct(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/recommendations:bulk"
      body: "*"
    };
  }
  rpc GetApprovalPolicy(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/recommendations:policy"
    };
  }
  rpc SetApprovalPolicy(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/recommendations:policy"
      body: "*"
    };
  }
  rpc ListSubscriptions(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/recommendations:subscriptions"
    };
  }
  rpc SetSubscription(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/recommendations:subscriptions"
      body: "*"
    };
  }
}

// Named operator accounts, their sessions and their tokens (chapter 14,
// "Operators"). Gateways relay these calls to the controller with the
// caller's credential, as every admin call; the controller's guard decides
// (decision OP12). `Login` and `Enrol` take no credential; the others take
// an operator's session (`Authorization: Bearer sprigop_...`), a token or
// the bootstrap token as the guard allows.
service Operators {
  // body_json: {"name", "password", "code" | "recovery_code", "client"}.
  // Replies with a session token, or with an enrolment ticket and an
  // otpauth:// URI when the operator has no second factor yet.
  rpc Login(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators:login"
      body: "*"
    };
  }
  // body_json: {"name", "ticket", "code"}: the first code from the
  // authenticator.
  // Replies with a session token and the recovery codes, shown once.
  rpc Enrol(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators:enrol"
      body: "*"
    };
  }
  // Ends the calling session.
  rpc Logout(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators:logout"
      body: "*"
    };
  }
  // The caller as the guard sees them: name, role, DCs, scopes, expiry.
  rpc WhoAmI(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/operators:whoami"
    };
  }
  rpc ListOperators(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/operators"
    };
  }
  // body_json: {"name", "role": "platform_operator" | "dc_operator", "dcs",
  // "password", "display_name", "email", "reason"}. Needs a platform
  // operator's login session.
  rpc CreateOperator(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators"
      body: "*"
    };
  }
  rpc GetOperator(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/operators/{name}"
    };
  }
  // body_json: {"reason"}. Revokes the operator's sessions and tokens.
  rpc DisableOperator(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators/{name}:disable"
      body: "*"
    };
  }
  rpc EnableOperator(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators/{name}:enable"
      body: "*"
    };
  }
  // body_json: {"reason"}. The operator enrols again at the next login.
  rpc ResetOperatorFactor(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators/{name}:resetFactor"
      body: "*"
    };
  }
  // body_json: {"password", "current", "reason"}; "current" is the old
  // password when operators change their own.
  rpc SetOperatorPassword(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operators/{name}:setPassword"
      body: "*"
    };
  }
  // body_json: {"label", "scopes", "dcs", "expires_in_days", "service",
  // "service_kind", "never_expires", "reason"}. Issued only from a login session
  // (OP5).
  rpc CreateToken(BodyRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operator-tokens"
      body: "*"
    };
  }
  // Query: owner.
  rpc ListTokens(ListRequest) returns (JsonReply) {
    option (google.api.http) = {
      get: "/admin/v1/operator-tokens"
    };
  }
  // name: the token's key id.
  rpc RevokeToken(NameRequest) returns (JsonReply) {
    option (google.api.http) = {
      post: "/admin/v1/operator-tokens/{name}:revoke"
      body: "*"
    };
  }
}
