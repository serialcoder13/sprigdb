[package]
name = "sprig-queues"
description = "SprigDB: the queue engine behind AMQP (exchanges, queues, owners, storage in MariaDB)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
metrics.workspace = true
mysql_async.workspace = true
# mq_permissions rules are RabbitMQ-style regular expressions. MIT/Apache-2.0,
# already in the tree.
regex = "1"
# HMAC-SHA256 of delivery tokens.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sprig-catalog.workspace = true
sprig-common.workspace = true
sprig-meta.workspace = true
sprig-proto-amqp = { path = "../sprig-proto-amqp" }
sprig-settings.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Independent AMQP clients for the client tests (rule 14; test-only):
# lapin (MIT) for 0-9-1, fe2o3-amqp (MIT/Apache-2.0) for 1.0. No TLS.
lapin = { version = "=4.12.3", default-features = false, features = ["default-runtime"] }
fe2o3-amqp = { version = "=0.18.4", default-features = false }
proptest.workspace = true
# The live shard-move test runs a mover worker in process (chapter 10).
sprig-cluster.workspace = true
sprig-mover.workspace = true
sprig-shard.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "test-util", "rt-multi-thread"] }
rustls.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
