# A tiny Compose project for sprig-testkit's own fixture tests.
services:
  hello:
    image: ${HELLO_IMAGE:-busybox:1.36}
    command:
      - sh
      - -c
      - trap 'exit 0' TERM; echo hello from the fixture; touch /tmp/ready; while :; do sleep 1; done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1::8080"]

  broken:
    profiles: [broken]
    image: ${HELLO_IMAGE:-busybox:1.36}
    command: ["sh", "-c", "echo failing on purpose; exit 3"]
