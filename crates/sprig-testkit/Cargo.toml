[package]
name = "sprig-testkit"
description = "SprigDB: The test harness, deterministic simulation, differential testing and Compose fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
mysql_async.workspace = true
sprig-common.workspace = true
sprig-meta.workspace = true
serde.workspace = true
serde_json.workspace = true
# rt + test-util: the simulation runs on a current-thread runtime with paused
# time; io-util for the toxiproxy HTTP client.
tokio = { workspace = true, features = ["rt", "test-util", "io-util"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
