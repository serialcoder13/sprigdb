[package]
name = "sprig-testkit"
description = "SprigDB: The test harness, deterministic simulation, differential testing and Compose fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
mysql_async.workspace = true
# The fleet simulator drives the real planner and scheduler.
sprig-balancer.workspace = true
sprig-binlog.workspace = true
sprig-catalog.workspace = true
sprig-common.workspace = true
sprig-meta.workspace = true
# The mover's simulation.
sprig-mover.workspace = true
# The feed handoff in the mover's simulation.
sprig-feed.workspace = true
# The after-commit trigger runner under the mover simulation.
sprig-logic = { path = "../sprig-logic" }
# The stream sequencer under the mover simulation.
sprig-streams = { path = "../sprig-streams" }
sprig-shard.workspace = true
serde.workspace = true
serde_json.workspace = true
# rt + test-util: the simulation runs on a current-thread runtime with paused
# time; io-util for the toxiproxy HTTP client.
tokio = { workspace = true, features = ["rt", "test-util", "io-util"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
