[package]
name = "json-storage-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Throwaway month-1 spike: MongoDB wire protocol over MariaDB JSON storage (chapter 31)"

# Not a member of the sprigdb workspace.
[workspace]

[profile.release]
debug = 1

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bson = "2"
hex = "0.4.3"
mysql_async = "0.37.1"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["full"] }
