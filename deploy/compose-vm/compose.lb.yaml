# A TCP load balancer in front of the gateways (RUNBOOK.md, "Load
# balancer"): Envoy (Apache-2.0), on its own small VM or
# on each VM behind a floating address. One listener per client port; each
# forwards connections to the gateways whose readiness endpoint answers 200
# (GET /readyz on their telemetry port, every second). A gateway that is
# stopping turns its readiness off first and keeps serving for
# gateway.drain_lb_delay_seconds (10 s), so the balancer stops sending it new
# connections before it closes its listeners; open sessions are left alone.
#
#   ./sprig-vm.sh lb-config     # writes lb/envoy.yaml from SPRIG_LB_GATEWAYS
#   ./sprig-vm.sh lb-up         # lb-config, then this file
#
# Needs no secrets: TLS passes through to the gateways untouched (clients
# verify the gateways' certificate, which must name the balancer's address:
# SPRIG_PUBLIC_HOST / SPRIG_TLS_SANS).

name: ${COMPOSE_PROJECT_NAME:-sprigdb}-lb

services:
  lb:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.34.1}
    restart: unless-stopped
    mem_limit: ${LB_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options:
        max-size: ${SPRIG_LOG_MAX_SIZE:-50m}
        max-file: "${SPRIG_LOG_MAX_FILES:-5}"
    command: [envoy, -c, /etc/envoy/envoy.yaml, --log-level, warn]
    volumes:
      - ./lb/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_MYSQL_PORT:-3306}:${SPRIG_MYSQL_PORT:-3306}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_MARIADB_PORT:-3307}:${SPRIG_MARIADB_PORT:-3307}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_HTTPS_PORT:-8443}:${SPRIG_HTTPS_PORT:-8443}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_MONGO_PORT:-27017}:${SPRIG_MONGO_PORT:-27017}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_REDIS_PORT:-6379}:${SPRIG_REDIS_PORT:-6379}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_BOLT_PORT:-7687}:${SPRIG_BOLT_PORT:-7687}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_KAFKA_PORT:-9092}:${SPRIG_KAFKA_PORT:-9092}"
      - "${SPRIG_LB_BIND_IP:-0.0.0.0}:${SPRIG_AMQPS_PORT:-5671}:${SPRIG_AMQPS_PORT:-5671}"
      # Envoy's admin page (/stats, /clusters: each gateway's health).
      - "127.0.0.1:${SPRIG_LB_ADMIN_PORT:-9901}:9901"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: lb\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 12
