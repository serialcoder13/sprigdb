# Prometheus for deploy/compose-vm (profile monitoring). Every SprigDB process
# serves /metrics on its telemetry port, 9180, inside the network.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.rules.yaml
scrape_configs:
  - job_name: sprigdb-gateway
    static_configs: [{ targets: ["gateway:9180"], labels: { role: gateway } }]
  - job_name: sprigdb-controller
    static_configs: [{ targets: ["controller:9180"], labels: { role: controller } }]
  - job_name: sprigdb-worker
    static_configs: [{ targets: ["worker:9180"], labels: { role: worker } }]
