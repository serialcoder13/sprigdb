---
# Install the package, etcd where needed, certificates and the small
# sprigdb.toml; start the agent on database hosts so they join the free
# pool.
- name: Install the sprigdb package (deb)
  ansible.builtin.apt:
    deb: "{{ sprigdb_package_dir }}/sprigdb_{{ sprigdb_version }}_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.deb"
  when: ansible_os_family == "Debian"

- name: Install the sprigdb package (rpm)
  ansible.builtin.dnf:
    name: "{{ sprigdb_package_dir }}/sprigdb-{{ sprigdb_version }}-1.{{ ansible_architecture }}.rpm"
    disable_gpg_check: true
  when: ansible_os_family == "RedHat"

- name: Install etcd from the upstream release archive
  when: "'etcd' in sprigdb_roles"
  block:
    - name: Create the etcd user
      ansible.builtin.user: {name: etcd, system: true, shell: /usr/sbin/nologin, create_home: false}
    - name: Unpack etcd
      ansible.builtin.unarchive:
        src: "{{ etcd_archive_url }}"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1, --wildcards, "*/etcd", "*/etcdctl", "*/etcdutl"]
        creates: /usr/local/bin/etcd

# etcd keeps every revision unless told otherwise, and its database grows
# (about 0.7 MB/h in the soak). etcd ignores command-line flags when it has
# a config file, so the keys go into the operator's
# /etc/sprigdb/etcd-<tier>.yaml.
- name: etcd keeps one hour of revisions (auto-compaction)
  when: "'etcd' in sprigdb_roles"
  block:
    - name: Find this host's etcd config files
      ansible.builtin.stat:
        path: "/etc/sprigdb/etcd-{{ item }}.yaml"
      loop: [dc, global]
      register: etcd_configs
    - name: Set auto-compaction in each
      ansible.builtin.lineinfile:
        path: "{{ item.0.stat.path }}"
        regexp: "^{{ item.1.key }}:"
        line: "{{ item.1.key }}: {{ item.1.value }}"
      loop: "{{ etcd_configs.results | selectattr('stat.exists') | product(etcd_compaction | dict2items) | list }}"
      notify: Restart etcd
    - name: The etcd defrag service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: sprigdb-etcd-defrag.service
          content: |
            # Returns the space auto-compaction frees to the disk.
            [Unit]
            Description=SprigDB etcd defragmentation (this host's member)
            After=sprigdb-etcd-dc.service
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/sprigdb/tls/ca.pem --cert={{ etcd_defrag_cert }} --key={{ etcd_defrag_key }} --command-timeout=120s defrag
        - name: sprigdb-etcd-defrag.timer
          content: |
            [Unit]
            Description=SprigDB etcd defragmentation, daily
            [Timer]
            OnCalendar={{ etcd_defrag_on_calendar }}
            RandomizedDelaySec=45min
            Persistent=true
            [Install]
            WantedBy=timers.target
    - name: Enable the etcd defrag timer
      ansible.builtin.systemd_service:
        name: sprigdb-etcd-defrag.timer
        enabled: true
        state: started
        daemon_reload: true

- name: Certificates from the deployment's CA
  ansible.builtin.copy:
    dest: "/etc/sprigdb/tls/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: sprigdb
    mode: "{{ item.mode }}"
  loop:
    - {name: ca.pem, content: "{{ sprigdb_ca_pem }}", mode: "0644"}
    - {name: cert.pem, content: "{{ sprigdb_cert_pem }}", mode: "0644"}
    - {name: key.pem, content: "{{ sprigdb_key_pem }}", mode: "0640"}
  no_log: true

- name: sprigdb.toml
  ansible.builtin.template:
    src: sprigdb.toml.j2
    dest: /etc/sprigdb/sprigdb.toml
    owner: root
    group: sprigdb
    mode: "0640"

- name: Enable and start this host's SprigDB units
  ansible.builtin.systemd_service:
    name: "sprigdb-{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ sprigdb_roles | map('replace', 'db', 'agent') | map('replace', 'etcd', 'etcd-dc') | list }}"
