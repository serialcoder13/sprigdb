# The three-DC layout of compose.3dc.yaml, as a sprig-testkit Env
# (Env::three_dc, or SPRIG_TEST_ENV_FILE=deploy/compose/env.3dc.toml).
# Keep the two files in step: host ports are 34<dc><nn> (see compose.3dc.yaml).
# Development credentials only.

name = "3dc"
global_etcd = [
  "http://127.0.0.1:34180",
  "http://127.0.0.1:34280",
  "http://127.0.0.1:34380",
]

[[dcs]]
id = "mum1"
subnet = "10.10.1.0/24"
etcd = ["http://127.0.0.1:34179"]

[[dcs.clusters]]
id = "mum1-c1"
topology = { kind = "primary_replicas", replicas = 2, semisync = true }
writer = "mysql://root:sprig-dev-root@127.0.0.1:34106"
readers = [
  "mysql://root:sprig-dev-root@127.0.0.1:34107",
  "mysql://root:sprig-dev-root@127.0.0.1:34108",
]

[[dcs]]
id = "fra1"
subnet = "10.10.2.0/24"
etcd = ["http://127.0.0.1:34279"]

[[dcs.clusters]]
id = "fra1-c1"
topology = { kind = "galera3" }
writer = "mysql://root:sprig-dev-root@127.0.0.1:34206"
readers = [
  "mysql://root:sprig-dev-root@127.0.0.1:34207",
  "mysql://root:sprig-dev-root@127.0.0.1:34208",
]

[[dcs]]
id = "iad1"
subnet = "10.10.3.0/24"
etcd = ["http://127.0.0.1:34379"]

[[dcs.clusters]]
id = "iad1-c1"
topology = { kind = "single" }
writer = "mysql://root:sprig-dev-root@127.0.0.1:34306"

# One-way delays added by netem (chapter 46's values); a ping shows twice.
[[links]]
a = "mum1"
b = "fra1"
one_way_ms = 30

[[links]]
a = "mum1"
b = "iad1"
one_way_ms = 80

[[links]]
a = "fra1"
b = "iad1"
one_way_ms = 60
