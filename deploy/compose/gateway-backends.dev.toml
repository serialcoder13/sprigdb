# The backend account tenant sessions use (format in
# crates/sprig-gateway/src/tenant/backends.rs).
# Development only.
#
# Catalog logins (`[gateway] login_mode = "catalog"`, gateway-dev.sh's
# default) run each user's statements as its own backend account
# ([per_user]); [default] serves only older binaries without per-user
# accounts. The cluster is each tenant's catalog cluster, from its shard
# map. Clients never see this account: names in output (DEFINER, grantees,
# messages) show the session's own user.

# Per-user backend accounts. Every tenant without its
# own [tenants.<name>] entry runs each user's statements as that user's own
# MariaDB account t<tenant>_u<user>, created and granted by the gateway
# only on the tenant's own schemas; passwords derive from this secret.
# Remove [per_user] to go back to the one shared account below.
[per_user]
secret = "file:gateway-backends.dev.toml#backend_secret"
tls = "skip_verify"

# Development only: the key per-user backend passwords derive from.
[backend_secret]
password = "sprig-dev-backend-accounts-secret"

[default]
backend_user = "root"
# A relative path is relative to this file's directory.
backend_credentials = "file:gateway-backends.dev.toml#backend_root"

# Per tenant, by name, when one needs another account:
# [tenants.acme]
# backend_user = "acme_app"
# backend_credentials = "env:ACME_BACKEND"

# compose.yaml's MariaDB root (MARIADB_ROOT_PASSWORD's default). The Compose
# servers have self-signed certificates, hence skip_verify.
[backend_root]
user = "root"
password = "sprig-dev-root"
tls = "skip_verify"
