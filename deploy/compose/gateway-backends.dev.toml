# The backend account tenant sessions use, interim (chapter 14, "Backend
# target, interim"; format in crates/sprig-gateway/src/tenant/backends.rs).
# Development only.
#
# Catalog logins (`[gateway] login_mode = "catalog"`, gateway-dev.sh's
# default) run every tenant's statements as one MariaDB account until
# chapter 29's per-user backend accounts (M0.5). The cluster is each
# tenant's catalog cluster, from its shard map. Clients never see this
# account: names in output (DEFINER, grantees, messages) show the session's
# own user.

[default]
backend_user = "root"
# A relative path is relative to this file's directory.
backend_credentials = "file:gateway-backends.dev.toml#backend_root"

# Per tenant, by name, when one needs another account:
# [tenants.acme]
# backend_user = "acme_app"
# backend_credentials = "env:ACME_BACKEND"

# compose.yaml's MariaDB root (MARIADB_ROOT_PASSWORD's default). The Compose
# servers have self-signed certificates, hence skip_verify.
[backend_root]
user = "root"
password = "sprig-dev-root"
tls = "skip_verify"
