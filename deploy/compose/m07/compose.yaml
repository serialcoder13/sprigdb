# M0.7's private control-plane stack (chapters 04, 23, 37): one etcd and one
# MariaDB, for tests that change dc-scope listener, TLS and gateway
# settings, drain gateways and run load. Those changes would hit every
# gateway of the shared dev stack's dc-a, so they run here, in a DC of
# their own (dc-m7) with its own etcd. Project sprigdb-dev-cp; run through
# stack.sh, which also starts the controller and gateways on the host.
#
#   deploy/compose/m07/stack.sh up | down | status
name: sprigdb-dev-cp

services:
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.6.5}
    command:
      - etcd
      - --name=etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:12479
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-0=http://etcd:2380
    ports: ["127.0.0.1:12479:2379"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 3s
      timeout: 5s
      retries: 20

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    hostname: m7-single
    environment:
      MARIADB_ROOT_PASSWORD: sprig-dev-root
    command: [--server-id=701, --gtid-domain-id=7, --innodb-buffer-pool-size=128M, --max-connections=400]
    ports: ["127.0.0.1:13391:3306"]
    volumes:
      - ../mariadb/binlog.cnf:/etc/mysql/conf.d/10-binlog.cnf:ro
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 768m
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
