# A development gateway next to the controller of sprigdb.dev.toml, in the
# same DC and on the same etcd. gateway-dev.sh runs both:
#
#   deploy/compose/gateway-dev.sh up
#
# or by hand, from the repository root:
#
#   cargo run -p sprigdb -- --config deploy/compose/sprigdb.gateway.dev.toml gateway
#
# The listeners aren't configured here: their addresses, TLS modes and
# certificate bundle are live settings in etcd, which gateway-dev.sh
# writes (13306 and 13307). Without them the gateway would try 3306 and 3307
# with TLS required and no certificate.
#
# Development only: plain-text etcd, no [tls].

[node]
dc = "dc-a"
id = "gw-1"

[meta]
dc_seeds = ["http://127.0.0.1:2379"]
global_seeds = []
deployment_id = "sprigdb-dev"

[gateway]
# Where logins come from: "catalog" (tenants acme and globex, users
# acme.app and globex.app, logical names) or "accounts_file" (the fixed
# logins app, app_repl and app_galera on the raw clusters, names unchanged).
# gateway-dev.sh sets SPRIGDB_GATEWAY_LOGIN_MODE from SPRIG_GATEWAY_LOGIN_MODE.
login_mode = "catalog"
# The address workers and other gateways use to reach this gateway. Without
# it the hostname is advertised, and on a laptop that can resolve to the LAN
# address while the peer listener is on 127.0.0.1 (seen after the 12 Nov
# reboot). SPRIGDB_GATEWAY_ADVERTISE_ADDR overrides it.
advertise_addr = "127.0.0.1"
# Paths are relative to the working directory, so run from the repository
# root, or set SPRIGDB_GATEWAY_* to absolute paths.
# accounts_file mode: the logins.
accounts_file = "deploy/compose/gateway-accounts.dev.toml"
# catalog mode: the backend account tenant sessions use.
backends_file = "deploy/compose/gateway-backends.dev.toml"
# Sealed parameter samples: the development master secret.
workload_key_file = "deploy/compose/workload-keys.dev"

[telemetry]
bootstrap_log_level = "info"
log_format = "pretty"
# The controller has 9180.
bootstrap_addr = "127.0.0.1:9190"
