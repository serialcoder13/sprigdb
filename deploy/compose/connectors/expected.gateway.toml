# Expected outcomes for the connector matrix through the gateway (M0.2),
# merged over expected.toml with SPRIG_CONN_EXPECTED_OVERLAY:
#
#   SPRIG_CONN_USER=app SPRIG_CONN_PASSWORD=sprig-dev-app \
#   SPRIG_CONN_EXPECTED_OVERLAY=deploy/compose/connectors/expected.gateway.toml \
#     deploy/compose/connectors/run.sh 127.0.0.1 13306 mysql
#
# Each entry is an interim decision of the plan's decisions/m0.2-interim.md.

[mysql."*"]
# D7: the check reads performance_schema.session_connect_attrs, which the
# MariaDB backends have off. The gateway parses the attributes; showing
# them there is the R4 translator's job (chapter 28).
conn_attrs = "skip"

[mysql.mysql-connector-j]
# D8: Connector/J 9.7 binds a BigInteger above Long.MAX_VALUE as a signed
# BIGINT (type 8, no unsigned flag) holding the bits of -1. MySQL 8.4
# resolves the parameter's type from the column (BIGINT UNSIGNED) and
# accepts it; MariaDB reads -1 and fails with 1264. MariaDB's PREPARE_OK
# reports untyped parameters (type NULL), so the gateway can't tell this
# from a real -1 until the parser and catalog know the column (the R4
# translator, chapter 28).
prepared_biginteger = "fail"

[mysql.hibernate]
# Hibernate with MySQL Connector/J reads information_schema.KEYWORDS
# WHERE RESERVED = 1 to resolve its dialect; MariaDB's KEYWORDS has no
# RESERVED column. The 3306 persona answers that the MySQL way with the
# core information_schema providers (M0.5; decisions/mysql-persona-gaps.md).
schema_validate = "fail"

[mysql.hibernate-mariadb]
# ddl-auto=validate expects a json column; MariaDB's JSON is LONGTEXT. The
# 3306 persona reports json for such columns in M0.5 (same decisions file).
schema_validate = "fail"
