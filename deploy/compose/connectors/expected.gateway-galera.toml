# Expected outcomes for the connector matrix through the gateway against
# the Galera cluster (login app_galera), merged over expected.toml with
# SPRIG_CONN_EXPECTED_OVERLAY. It repeats expected.gateway.toml (one overlay
# per run) and adds what Galera itself does differently:
#
#   SPRIG_CONN_USER=app_galera SPRIG_CONN_PASSWORD=sprig-dev-app \
#   SPRIG_CONN_EXPECTED_OVERLAY=deploy/compose/connectors/expected.gateway-galera.toml \
#     deploy/compose/connectors/run.sh 127.0.0.1 13307 mariadb

[mysql."*"]
# performance_schema is off on the backends (see expected.gateway.toml).
conn_attrs = "skip"

[mysql.mysql-connector-j]
# A BigInteger above Long.MAX_VALUE (see expected.gateway.toml).
prepared_biginteger = "fail"

[all."*"]
# Galera's wsrep_auto_increment_control sets auto_increment_increment to
# the cluster size (3) and the offset per node, so a multi-row insert's ids
# step by 3 and the first id isn't the one the check expects; straight on
# a Galera node the same happens.
last_insert_id = "fail"
# The checks expect auto_increment_increment back at 1 after the reset;
# Galera's baseline is 3, which is what the gateway restores.
change_user = "fail"
reset_connection = "fail"

# The same auto-increment step: SQLAlchemy's core check reads back id 1,
# and the dump checks compare AUTO_INCREMENT values and a row inserted
# after the restore.
[all.sqlalchemy-pymysql]
core = "fail"

[all.sqlalchemy-mysqlclient]
core = "fail"

[all.mysqldump]
objects = "fail"

[all.mariadb-dump]
objects = "fail"

[mysql.hibernate]
# Hibernate with MySQL Connector/J reads information_schema.KEYWORDS
# WHERE RESERVED = 1 to resolve its dialect; MariaDB's KEYWORDS has no
# RESERVED column. The 3306 persona answers that the MySQL way with the
# core information_schema providers.
schema_validate = "fail"
# MySQLDialect binds JSON values as CAST(? AS json), which MariaDB has no
# syntax for (1064): a rewrite for the translator.
crud = "fail"
query = "fail"
optimistic_lock = "fail"

[mysql.hibernate-mariadb]
# ddl-auto=validate expects a json column; MariaDB's JSON is LONGTEXT. The
# 3306 persona is meant to report json for such columns.
schema_validate = "fail"

[mysql.sqlalchemy-pymysql]
# JSON columns reflect as LONGTEXT (MariaDB's JSON); the 3306 persona
# is meant to report json.
reflection = "fail"

[mysql.sqlalchemy-mysqlclient]
# As sqlalchemy-pymysql.
reflection = "fail"

[mysql.prisma]
# db pull introspects JSON columns as LONGTEXT; the steps
# after it report "an earlier step failed".
connect = "fail"
db_pull = "fail"
generate = "fail"
query = "fail"
transaction = "fail"

[mysql.mysqldump]
# mysqldump 8.4 reads information_schema.COLUMN_STATISTICS and sets
# terminology_use_previous, which MariaDB lacks.
dump = "fail"

[mysql.mariadb-dump]
# Against MySQL 8.4 the restore rejects values for virtual generated
# columns; behind the gateway the backend is MariaDB, so it works.
restore = "pass"
checksum = "pass"
# This section overrides [all.mariadb-dump]: objects still fails on Galera
# for the auto-increment step above (p_count sees ids stepping by 3).
objects = "fail"

[mysql.sysbench-tpcc]
# MySQL 8.4 accepts w_ytd under ONLY_FULL_GROUP_BY because it depends on
# the grouped primary key (functional dependence); MariaDB doesn't detect
# that and fails with 1055. The 3306 persona's sql_mode comes from MySQL 8.4,
# so this needs the translator (or a looser persona sql_mode). sysbench
# runs plaintext only, so only the disabled pass reports it.
disabled.check = "fail"
