# SprigDB development environment (chapter 27, "Development setup"; chapter
# 46, "Integration with Docker Compose").
#
# This first version runs one simulated data center: a single-member etcd
# (single-etcd mode, chapter 23) and MariaDB in three topologies, one profile
# each. Start one topology at a time:
#
#   docker compose --profile single up -d        # etcd + one node
#   docker compose --profile replication up -d   # etcd + primary + 2 replicas, semi-sync AFTER_SYNC
#   docker compose --profile galera up -d        # etcd + 3-node Galera
#   docker compose --profile all up -d           # everything
#   docker compose --profile all down -v         # stop and delete the data
#
# Fault injection (toxiproxy, faultd) and elle-cli have profiles of their
# own, faults and elle, outside `all`: see the end of this file.
#
# Per-node identity follows chapter 27: server_id = cluster_number * 100 +
# index, gtid_domain_id = cluster_number. Cluster numbers: single 1,
# replication 2, galera 3. Galera nodes share wsrep_gtid_domain_id 3 and keep
# distinct node-local domains (301-303).
#
# Ports are bound to 127.0.0.1 only and kept away from 3306/3307, which the
# SprigDB gateway uses.

name: ${COMPOSE_PROJECT_NAME:-sprigdb-dev}

x-mariadb: &mariadb
  image: ${MARIADB_IMAGE:-mariadb:11.8}
  environment: &mariadb-env
    MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-sprig-dev-root}
  networks: [dc-a]
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  # Seven servers share one Docker VM (often 8 GB, shared with other work).
  # A cap makes a runaway test restart its own server instead of the kernel
  # killing an unrelated container. Override with MARIADB_MEM_LIMIT.
  mem_limit: ${MARIADB_MEM_LIMIT:-1536m}
  memswap_limit: ${MARIADB_MEMSWAP_LIMIT:-2g}
  healthcheck: &mariadb-health
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s

x-galera-health: &galera-health
  # Synced (wsrep_local_state 4). Uses root: after SST a joiner holds the
  # donor's users, so the image's own healthcheck account isn't reliable.
  test:
    - CMD-SHELL
    - >-
      mariadb -uroot -p"$$MARIADB_ROOT_PASSWORD" -Nse
      "SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS
      WHERE VARIABLE_NAME = 'wsrep_local_state'" | grep -qx 4
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 30s

services:
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.6.5}
    command:
      - etcd
      - --name=etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-0=http://etcd:2380
    networks: [dc-a]
    ports: ["127.0.0.1:2379:2379"]
    volumes: [etcd-data:/etcd-data]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- single node: cluster 1 -------------------------------------------
  single:
    <<: *mariadb
    profiles: [single, all]
    hostname: single
    command: [--server-id=101, --gtid-domain-id=1]
    ports: ["127.0.0.1:13301:3306"]
    volumes:
      - ./mariadb/binlog.cnf:/etc/mysql/conf.d/10-binlog.cnf:ro

  # --- primary + 2 replicas, semi-sync AFTER_SYNC: cluster 2 -------------
  primary:
    <<: *mariadb
    profiles: [replication, all]
    hostname: primary
    command: [--server-id=201, --gtid-domain-id=2, --rpl-semi-sync-master-enabled=ON]
    environment:
      <<: *mariadb-env
      MARIADB_REPLICATION_USER: sprig_repl
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD:-sprig-dev-repl}
    ports: ["127.0.0.1:13311:3306"]
    volumes: &replication-conf
      - ./mariadb/binlog.cnf:/etc/mysql/conf.d/10-binlog.cnf:ro
      - ./mariadb/semi-sync.cnf:/etc/mysql/conf.d/20-semi-sync.cnf:ro

  replica-1: &replica
    <<: *mariadb
    profiles: [replication, all]
    hostname: replica-1
    command: [--server-id=202, --gtid-domain-id=2, --read-only=ON]
    environment: &replica-env
      <<: *mariadb-env
      MARIADB_MASTER_HOST: primary
      MARIADB_REPLICATION_USER: sprig_repl
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD:-sprig-dev-repl}
      MARIADB_HEALTHCHECK_GRANTS: REPLICA MONITOR
    healthcheck:
      <<: *mariadb-health
      test: ["CMD", "healthcheck.sh", "--connect", "--replication_io", "--replication_sql", "--replication"]
    depends_on:
      primary: { condition: service_healthy }
    ports: ["127.0.0.1:13312:3306"]
    volumes: *replication-conf

  replica-2:
    <<: *replica
    hostname: replica-2
    command: [--server-id=203, --gtid-domain-id=2, --read-only=ON]
    ports: ["127.0.0.1:13313:3306"]

  # --- 3-node Galera: cluster 3 -------------------------------------------
  galera-1:
    <<: *mariadb
    profiles: [galera, all]
    hostname: galera-1
    # Bootstraps a new cluster only when it should: on a fresh volume (no
    # grastate.dat) or when Galera marked this node safe_to_bootstrap: 1 (it
    # was the last to leave). Otherwise it joins the running cluster, so a
    # restarted or recreated galera-1 rejoins instead of refusing to start or
    # splitting the cluster. If every node is down and galera-1 wasn't the
    # last one, start the node with safe_to_bootstrap: 1 first, or reset the
    # cluster with `down -v`.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        g=/var/lib/mysql/grastate.dat;
        if [ ! -s "$$g" ] || grep -q '^safe_to_bootstrap: *1' "$$g"; then
        set -- --wsrep-new-cluster "$$@"; fi;
        exec docker-entrypoint.sh mariadbd "$$@"
      - galera-1
    command:
      - --server-id=301
      - --gtid-domain-id=301
      - --wsrep-gtid-domain-id=3
      - --wsrep-node-address=galera-1
      - --wsrep-sst-auth=root:${MARIADB_ROOT_PASSWORD:-sprig-dev-root}
    healthcheck: *galera-health
    ports: ["127.0.0.1:13321:3306"]
    volumes: &galera-conf
      - ./mariadb/binlog.cnf:/etc/mysql/conf.d/10-binlog.cnf:ro
      - ./mariadb/galera.cnf:/etc/mysql/conf.d/20-galera.cnf:ro

  galera-2:
    <<: *mariadb
    profiles: [galera, all]
    hostname: galera-2
    command:
      - --server-id=302
      - --gtid-domain-id=302
      - --wsrep-gtid-domain-id=3
      - --wsrep-node-address=galera-2
      - --wsrep-sst-auth=root:${MARIADB_ROOT_PASSWORD:-sprig-dev-root}
    healthcheck: *galera-health
    depends_on:
      galera-1: { condition: service_healthy }
    ports: ["127.0.0.1:13322:3306"]
    volumes: *galera-conf

  galera-3:
    <<: *mariadb
    profiles: [galera, all]
    hostname: galera-3
    command:
      - --server-id=303
      - --gtid-domain-id=303
      - --wsrep-gtid-domain-id=3
      - --wsrep-node-address=galera-3
      - --wsrep-sst-auth=root:${MARIADB_ROOT_PASSWORD:-sprig-dev-root}
    healthcheck: *galera-health
    depends_on:
      galera-2: { condition: service_healthy }
    ports: ["127.0.0.1:13323:3306"]
    volumes: *galera-conf

  # --- fault injection (chapter 46, "Fault injection"): profile faults ----
  # Start next to a running stack without touching it:
  #
  #   docker compose --profile faults up -d toxiproxy faultd
  #
  # toxiproxy's API is on 127.0.0.1:18474. Tests create their own proxies
  # (named sprig-sim-*), listening on 13400-13419 inside the container and
  # published on the same host ports, with upstreams such as single:3306,
  # and add toxics to them. faultd runs iptables and tc inside other
  # containers' network namespaces; sprig-testkit only points it at its own
  # sprig-sim-* containers.
  toxiproxy:
    image: ${TOXIPROXY_IMAGE:-ghcr.io/shopify/toxiproxy:2.12.0}
    profiles: [faults]
    networks: [dc-a]
    ports:
      - "127.0.0.1:18474:8474"
      - "127.0.0.1:13400-13419:13400-13419"

  faultd:
    build: ./faultd
    image: sprigdb-faultd:dev
    profiles: [faults]
    privileged: true
    pid: host
    network_mode: none

  # elle-cli for history checks (profile elle; build only, run per check):
  #   docker compose --profile elle build elle
  elle:
    build: ./elle
    image: sprigdb-elle:dev
    profiles: [elle]
    network_mode: none

  # --- connector matrix and sysbench (chapter 46, step 5; chapter 05,
  # step 13): profile connectors. One image per client runtime; run.sh
  # builds them and runs one container per connector and TLS mode, one at a
  # time, against any endpoint (MariaDB or MySQL directly today, the
  # gateway's 3306 and 3307 later):
  #
  #   connectors/run.sh 127.0.0.1 13301 mariadb
  #
  # Containers reach a loopback target through host.docker.internal on
  # Docker Desktop, or the host network on Linux (SPRIG_CONN_NETWORK_MODE,
  # which run.sh sets). See connectors/README.md.
  conn-java: &connector
    build: ./connectors/java
    image: sprigdb-conn-java:dev
    profiles: [connectors]
    network_mode: ${SPRIG_CONN_NETWORK_MODE:-bridge}
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 768m

  conn-go:
    <<: *connector
    build: ./connectors/go
    image: sprigdb-conn-go:dev
    mem_limit: 256m

  conn-node:
    <<: *connector
    build: ./connectors/node
    image: sprigdb-conn-node:dev
    mem_limit: 512m

  conn-python:
    <<: *connector
    build: ./connectors/python
    image: sprigdb-conn-python:dev
    mem_limit: 512m

  conn-php:
    <<: *connector
    build: ./connectors/php
    image: sprigdb-conn-php:dev
    mem_limit: 768m

  conn-mysql-cli:
    <<: *connector
    build:
      context: ./connectors/cli
      args: { BASE: "mysql:8.4.11" }
    image: sprigdb-conn-mysql-cli:dev
    mem_limit: 512m

  conn-mariadb-cli:
    <<: *connector
    build:
      context: ./connectors/cli
      args: { BASE: "mariadb:11.8.9" }
    image: sprigdb-conn-mariadb-cli:dev
    mem_limit: 512m

  sysbench:
    <<: *connector
    build: ./connectors/sysbench
    image: sprigdb-sysbench:dev
    mem_limit: 256m

  # Hibernate 6 via Spring Data JPA (connectors hibernate, hibernate-mariadb).
  conn-hibernate:
    <<: *connector
    build: ./connectors/hibernate
    image: sprigdb-conn-hibernate:dev
    mem_limit: 768m

  # Prisma ORM 6: schema engine (db pull) and query engine (connector prisma).
  conn-prisma:
    <<: *connector
    build: ./connectors/prisma
    image: sprigdb-conn-prisma:dev
    mem_limit: 768m

  # Milestone M0.3's "done when" harness (m03/README.md): two tenants run the
  # same schema-tool suite (Flyway, Hibernate validation, mysqldump and
  # mariadb-dump) and the isolation checks, one container at a time:
  #
  #   m03/run.sh 127.0.0.1 13307 mariadb acme.app globex.app sprig-dev-app
  #
  # The CLI services reuse the connector matrix's images; JVMs are capped
  # below their mem_limit.
  m03-flyway:
    image: flyway/flyway:13.8.1
    profiles: [m03]
    network_mode: ${SPRIG_CONN_NETWORK_MODE:-bridge}
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      JAVA_ARGS: -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    volumes: ["./m03/flyway/sql:/flyway/sql:ro"]
    mem_limit: 384m

  m03-hibernate:
    <<: *connector
    build:
      context: ./m03/hibernate
      additional_contexts: { conn: ./connectors/hibernate }
    image: sprigdb-m03-hibernate:dev
    profiles: [m03]
    mem_limit: 512m

  m03-mysql-cli:
    <<: *connector
    build:
      context: ./connectors/cli
      args: { BASE: "mysql:8.4.11" }
    image: sprigdb-conn-mysql-cli:dev
    profiles: [m03]
    entrypoint: ["bash", "/m03/sql/suite.sh"]
    volumes: ["./m03:/m03:ro"]
    mem_limit: 256m

  m03-mariadb-cli:
    <<: *connector
    build:
      context: ./connectors/cli
      args: { BASE: "mariadb:11.8.9" }
    image: sprigdb-conn-mariadb-cli:dev
    profiles: [m03]
    entrypoint: ["bash", "/m03/sql/suite.sh"]
    volumes: ["./m03:/m03:ro"]
    mem_limit: 256m

networks:
  dc-a: {}

# MariaDB data lives in each container's anonymous volume: `down -v` resets it.
volumes:
  etcd-data: {}
