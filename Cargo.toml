[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/modlix-india/sprigdb"
publish = false

[workspace.dependencies]
# Workspace crates.
sprig-common = { path = "crates/sprig-common" }
sprig-settings = { path = "crates/sprig-settings" }
sprig-residency = { path = "crates/sprig-residency" }
sprig-meta = { path = "crates/sprig-meta" }
sprig-gateway = { path = "crates/sprig-gateway" }
sprig-controller = { path = "crates/sprig-controller" }
sprig-worker = { path = "crates/sprig-worker" }
sprig-agent = { path = "crates/sprig-agent" }
sprig-operator = { path = "crates/sprig-operator" }
sprig-cluster = { path = "crates/sprig-cluster" }
sprig-testkit = { path = "crates/sprig-testkit" }
sprig-provision = { path = "crates/sprig-provision" }
sprig-binlog = { path = "crates/sprig-binlog" }
sprig-catalog = { path = "crates/sprig-catalog" }
# The mover (chapter 10) and the R0 sharding pieces it moves (chapter 15).
sprig-shard = { path = "crates/sprig-shard" }
sprig-router = { path = "crates/sprig-router" }
sprig-txn = { path = "crates/sprig-txn" }
sprig-mover = { path = "crates/sprig-mover" }
# The change feed (chapter 38); the mover writes its handoff records.
sprig-feed = { path = "crates/sprig-feed" }

# Third-party crates. Every licence must be on deny.toml's allow-list (chapter 03).
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
gethostname = "1.1"
linkme = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
toml = "1.2"
tonic = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

# Added for the next M0.1 steps (control plane, clusters, listeners).
etcd-client = "0.21"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# mysql_async's row type, built from the gateway's own connections (chapter
# 19's lookup sessions on the router's coordinator branches).
mysql_common = { version = "0.37", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"

# The binlog client and parser (chapter 10): CRC32 event checksums, zlib for
# compressed events and columns (pure-Rust backend), SHA-1 for
# mysql_native_password.
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha1 = "0.10"

# xxh3_64 for the Galera writer choice (chapter 09). MIT.
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64"] }
# Kafka record batch compression (chapter 45): snappy (BSD-3-Clause, no
# dependencies) and LZ4 frames (MIT; its frame checksum uses twox-hash's
# xxhash32 above). Approved by Kiran, 9 November 2026.
snap = "=1.1.2"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "frame", "checked-decode"] }
# The server binary's allocator, opt-in (`sprigdb --features mimalloc`;
# perf1, S143): mimalloc and libmimalloc-sys are MIT.
mimalloc = { version = "=0.1.52", default-features = false }

# The Admin API's HTTP client in sprigctl (chapter 47); the server side is
# axum. hyper and hyper-util are MIT, http-body-util MIT.
hyper = { version = "1.6", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# The internal services' TLS connector (sprig-common::https, hardening round 3); MIT,
# already in the tree through hyper-util.
tower-service = "0.3"

# sprig-auth (chapter 14, M0.2 interim accounts): SHA-256 for
# caching_sha2_password (SHA-1 is above), constant-time compares, salts from
# the OS generator, zeroized password buffers, and atomic account swaps.
# sha2, subtle, getrandom, zeroize, arc-swap: MIT or Apache-2.0.
sprig-auth = { path = "crates/sprig-auth" }
arc-swap = "1.7"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"
# SASLprep (RFC 4013) for SCRAM-SHA-256 verifiers (chapter 14), with its
# Unicode tables (unicode-normalization, unicode-bidi, unicode-properties,
# tinyvec). All MIT/Apache-2.0 (tinyvec also Zlib); from the local registry.
stringprep = "=0.1.5"

# The MySQL and MariaDB wire codec (chapter 05): byte buffers, capability
# bitflags, zstd compressed framing (zstd crate MIT; zstd-sys and zstd-safe
# MIT/Apache-2.0; libzstd is BSD), and property tests. proptest is
# MIT/Apache-2.0.
sprig-proto-mysql = { path = "crates/sprig-proto-mysql" }
bitflags = "2.13"
bytes = "1.12"
zstd = { version = "0.13", default-features = false }
proptest = { version = "1.7", default-features = false, features = ["std"] }

# sprig-sql (chapter 07, name virtualization; chapter 28 builds on its lexer):
# sqlparser-rs for statement ASTs with spans, and its visitor. Apache-2.0.
sprig-sql = { path = "crates/sprig-sql" }
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }

# DataFusion for analytic reads (chapter 17, "Analytic reads (R3)"; Kiran's
# answer "both" to R3's Q1; approved in brief rule 14). Apache-2.0; without
# default features (no Parquet, no compression codecs). Its 230 transitive
# crates are MIT, Apache-2.0, BSD, Zlib or Unicode, or offer one of them;
# tiny-keccak (CC0) was already in the tree through const-random.
datafusion = { version = "=55.2.0", default-features = false, features = ["sql"] }

# sprig-workload (chapter 12, M0.4: fingerprints, shapes, the recorder). No new
# third-party crates: it uses serde, serde_json, sqlparser, twox-hash (xxh3_64
# digests) and proptest from above.
sprig-workload = { path = "crates/sprig-workload" }
# Sealed parameter samples (chapter 12 step 6): AES-256-GCM and HKDF-SHA256
# from ring, already in the tree through rustls (Apache-2.0 AND ISC).
ring = "0.17"
# sprig-advisor (chapter 13): the controller serves its store through the Admin API.
sprig-advisor = { path = "crates/sprig-advisor" }

# sprig-api (chapter 37) and the gateway's HTTP listeners (chapter 04 step 4):
# protobuf messages (prost, prost-types: Apache-2.0), tonic's prost codec
# (MIT), hyper-util's server for HTTP/1.1 and h2 on one port (MIT), base64
# (MIT/Apache-2.0) for binary cells and handles. Generated code is checked
# in; tonic-prost-build (MIT) only regenerates it in a test.
sprig-api = { path = "crates/sprig-api" }
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
base64 = "0.22"
# sprig-balancer (chapter 11, M0.6): placement, the decision log, the fleet
# simulator's planner.
sprig-balancer = { path = "crates/sprig-balancer" }
# Approvals and recommendations (chapter 52).
sprig-approvals = { path = "crates/sprig-approvals" }
# The logic layer's fallback tier (chapter 41, R7 order 4): sprig-logic-js
# runs KIRun on `kirun`, Modlix's open-source KIRun runtime for Rust (MIT;
# the only Modlix part SprigDB uses). It turns on serde_json's
# preserve_order and float_roundtrip wherever it is linked.
sprig-logic-js = { path = "crates/sprig-logic-js" }
kirun = "2.2"
# Full-text search (chapter 39, R5 round 5): Tantivy (MIT), pinned. Without
# default features: memory-mapped directories, stop words, Snowball stemmers
# (frostem, BSD-3-Clause) and LZ4 doc-store compression (lz4_flex, MIT, already
# in the tree). Its new transitive crates are MIT, Apache-2.0, BSD, Zlib or
# Unicode, or offer one of them (listed in decisions/r5-interim.md, S-items).
sprig-search = { path = "crates/sprig-search" }
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "stopwords", "stemmer", "lz4-compression"] }

# The docs pack and docs search. sprig-docs reads and writes packs (CBOR chunks
# with ciborium, Apache-2.0; f16 embeddings with half, already in the tree;
# English stems with frostem, BSD-3-Clause, already in the tree through
# Tantivy). sprig-embed runs the local embedding model, BAAI/bge-small-en-v1.5
# (MIT weights), on the CPU with candle (MIT OR Apache-2.0) and Hugging Face
# tokenizers (Apache-2.0) without Oniguruma: the pure-Rust fancy-regex backend
# (MIT), the same version candle itself uses. Pinned, because the pack's bytes
# depend on the maths.
sprig-docs = { path = "crates/sprig-docs" }
sprig-embed = { path = "crates/sprig-embed" }
ciborium = "=0.2.2"
half = "2.7"
frostem = { version = "1.20260821", default-features = false, features = ["english"] }
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
# `deny`, not `forbid`, so vetted spots can opt out with a `SAFETY:` comment
# (chapter 03). The only one so far: linkme's link sections in sprig-settings.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Holding a std lock across an .await is an error (chapter 03, Concurrency).
await_holding_lock = "deny"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
