# Retrieval golden set for the docs pack.
#
# Each question is one a user, DBA or operator might ask, with the page under
# docs/ that answers it (`page`), optionally the part of the heading path the
# answering chunk must have (`heading`), text it must contain (`contains`,
# for an identifier asked about), and other pages that answer it just as well
# (`also`). A question counts as answered when a chunk that matches is
# among the top five hits.
#
#   cargo run --release -p sprig-docs-gen --no-default-features --bin docs-pack -- \
#       eval --model target/models/bge-small-en-v1.5
#
# Change an answer only when the docs move; don't tune the answers to the search.

