# What each SprigDB error means and what to do about it. Merged into
# docs/reference/errors.md by `cargo run -p sprig-docs-gen`. Keyed by the
# MySQL name. `meaning` was seeded from the design notes; add `what_to_do`
# as guides are written.

[ER_SPRIG_RESERVED_NAME]
meaning = "Creating an object with a reserved name."

[ER_SPRIG_NAME_REWRITE_UNSUPPORTED]
meaning = "A name the rewriter can't map safely."

[ER_SPRIG_METADATA_TOO_LARGE]
meaning = "A SprigDB `information_schema` view would inline more than `names.local_view_max_rows` rows (10,000); narrow by schema or table."

[ER_SPRIG_CATALOG_UNAVAILABLE]
meaning = "Catalog writer or global tier unreachable."

[ER_SPRIG_CATALOG_CONFLICT]
meaning = "Catalog row or migration lock busy."

[ER_SPRIG_TENANT_NOT_READY]
meaning = "No directory entry, or catalog not migrated."

[ER_SPRIG_CATALOG_FORMAT_TOO_NEW]
meaning = "Catalog format newer than the binary reads."

[ER_SPRIG_CLUSTER_FENCE_FAILED]
meaning = "A fence could not complete and was rolled back."

[ER_SPRIG_CLUSTER_NOT_FOUND]
meaning = "No such cluster."

[ER_SPRIG_CLUSTER_EXISTS]
meaning = "A cluster of that name exists in the DC."

[ER_SPRIG_CLUSTER_STATE_INVALID]
meaning = "Command doesn't apply in the cluster's state."

[ER_SPRIG_BINLOG_CORRUPT]
meaning = "An event fails its checksum or can't be decoded."

[ER_SPRIG_BINLOG_DISCONNECTED]
meaning = "The binlog dump connection dropped (retryable)."

[ER_SPRIG_BINLOG_UNSUPPORTED]
meaning = "The source needs a binlog feature the reader lacks."

[ER_SPRIG_PLACEMENT_UNAVAILABLE]
meaning = "No cluster can take the placement, such as a new tenant's catalog (no active cluster, or the `--cluster` asked for isn't one)."

[ER_SPRIG_JOB_NOT_FOUND]
meaning = "No mover job by that id in the DC."

[ER_SPRIG_SHARD_LOCKED]
meaning = "Another job holds the shard (R0: the tenant)."

[ER_SPRIG_JOB_STATE_INVALID]
meaning = "The job's state doesn't allow the request, such as cancelling after the commit."

[ER_SPRIG_JOB_LEASE_LOST]
meaning = "The worker lost the job (lease ended, or a newer owner's token)."

[ER_SPRIG_MOVE_SOURCE_DIVERGED]
meaning = "The source no longer has the job's position (purged, lossy failover, incident); the copy restarts."

[ER_SPRIG_MOVE_CUTOVER_ABORTED]
meaning = "A cutover attempt was aborted; the source stayed authoritative."

[ER_SPRIG_MOVE_VERIFY_FAILED]
meaning = "Target still differs after `mover.verify_max_repairs` repairs."

[ER_SPRIG_MOVE_UNSUPPORTED]
meaning = "Statement-based DML, a table without a primary key, or DDL on a copy-and-swap table."

[ER_SPRIG_AUTO_INDEX_NOT_FOUND]
meaning = "No automatic index or recommendation by that id or name in the tenant."

[ER_SPRIG_AUTO_INDEX_STATE_INVALID]
meaning = "The index's state doesn't allow the action (approve a non-recommendation, drop a pinned index), or another loop changed it meanwhile."

[ER_SPRIG_SINK_NOT_FOUND]
meaning = "Unknown sink or connection."

[ER_SPRIG_SINK_EXISTS]
meaning = "Name in use."

[ER_SPRIG_SINK_PRIVILEGE]
meaning = "Creating or altering sinks or connections without `SPRIG_SINK_ADMIN`, naming a connection without `USAGE`, or a fan-in sink without `SPRIG_FAN_IN`."

[ER_SPRIG_SINK_DESTINATION_NOT_ALLOWED]
meaning = "Host not on `sink.destination_allowlist`, or a private, loopback or link-local address not listed literally."

[ER_SPRIG_SINK_RESIDENCY]
meaning = "The destination's tags don't satisfy the tenant's residency policy, or it has none while the tenant is pinned."

[ER_SPRIG_SINK_CONNECTION_IN_USE]
meaning = "Dropping a connection that sinks use."

[ER_SPRIG_SINK_CREDENTIALS_INVALID]
meaning = "A credential the connection type doesn't take, or one it needs is missing."

[ER_SPRIG_SINK_EXACTLY_ONCE_UNSUPPORTED]
meaning = "`EXACTLY ONCE` for a source and target that can't give it."

[ER_SPRIG_SINK_OPTION_INVALID]
meaning = "Unknown or invalid option, template or column list."

[ER_SPRIG_SINK_TRANSFORM_INVALID]
meaning = "The transform writes data, calls out, or isn't deterministic under `EXACTLY ONCE`."

[ER_SPRIG_SINK_SCRIPT_FAILED]
meaning = "A script raised an error or returned a malformed result (recorded per batch)."

[ER_SPRIG_SINK_DELIVERY_FAILED]
meaning = "The destination refused or failed; the message carries its status or error code."

[ER_SPRIG_SINK_PAUSED]
meaning = "The sink paused itself after `sink.pause_after_minutes` of failures."

[ER_SPRIG_SINK_SOURCE_LOST]
meaning = "The position fell behind the source's retention or the feed reset."

[ER_SPRIG_SINK_SCHEMA_MISMATCH]
meaning = "The destination table or file schema doesn't fit the records under the schema policy."

[ER_SPRIG_SINK_RECORD_TOO_LARGE]
meaning = "A record alone exceeds what the destination accepts."

[ER_SPRIG_SINK_QUOTA]
meaning = "Over `sink.max_per_tenant` or a throughput quota."

[ER_SPRIG_SINK_FENCED]
meaning = "A task's epoch moved on; the old worker stops (internal)."

[ER_SPRIG_SINK_PLATFORM_IDENTITY_DENIED]
meaning = "Instance metadata, web identity or role assumption without the operator's permission."

[ER_SPRIG_SINK_OWNER_PRIVILEGE_LOST]
meaning = "The owner can no longer read the source; the sink pauses."

[ER_SPRIG_SINK_DISABLED]
meaning = "`sink.enabled` is off, or the target kind isn't in `sink.allowed_kinds`."

[ER_SPRIG_SINK_FORMAT_UNSUPPORTED]
meaning = "A format or compression the target or source can't produce."

[ER_SPRIG_SINK_STATE]
meaning = "An operation the sink's state doesn't allow (resume while dropping)."

[ER_SPRIG_SINK_PLATFORM_CONNECTION_NOT_GRANTED]
meaning = "Naming a platform connection the tenant isn't granted, or one whose grant was revoked (the sink pauses)."

[ER_SPRIG_SINK_PLATFORM_SECRET_UNAVAILABLE]
meaning = "A worker can't read a platform connection's secret file (alert to operators)."

[ER_SPRIG_SINK_SCRIPT_READ_ONLY]
meaning = "A script's `db` handle was given anything but a read."

[ER_SPRIG_INHERIT_INSTANCE_QUOTA]
meaning = "Over `inherit.max_definitions_per_tenant` in the declaring tenant, or `inherit.max_instances_per_tenant` in a member."

[ER_SPRIG_INHERIT_CONFIG_MISSING]
meaning = "An inherited connection's `REQUIRED` option or credential isn't set for this member; the sink instance waits (state reason, not a publish error)."

[ER_SPRIG_INHERIT_RUN_AS_PRIVILEGE]
meaning = "The member's `sprig_inherited` principal lacks a privilege the definition's `GRANTS` asks for (a member administrator revoked it); the trigger or sink instance is blocked."

[ER_SPRIG_INHERIT_RESIDENCY]
meaning = "A fan-in read would carry a member's records where its residency policy forbids; under `residency.cross_tenant_messaging_strict`, a cross-tenant publish would store a message where it forbids."

[ER_SPRIG_INHERIT_BROADCAST_LIMIT]
meaning = "A broadcast over `inherit.broadcast_max_bytes`, `inherit.broadcasts_per_hour` or `inherit.broadcast_max_members`."

[ER_SPRIG_INHERIT_OUTBOX_PENDING]
meaning = "`DROP DATABASE` of a database whose cross-tenant outbox still holds committed messages after `inherit.outbox_drain_seconds`; the text names the count (retryable)."

[ER_SPRIG_MQ_NOT_FOUND]
meaning = "404, amqp:not-found."

[ER_SPRIG_MQ_PRECONDITION]
meaning = "406."

[ER_SPRIG_MQ_RESOURCE_LOCKED]
meaning = "405."

[ER_SPRIG_MQ_ACCESS_REFUSED]
meaning = "403, amqp:unauthorized-access."

[ER_SPRIG_MQ_NOT_IMPLEMENTED]
meaning = "540, amqp:not-implemented."

[ER_SPRIG_MQ_UNROUTABLE]
meaning = "312 (return)."

[ER_SPRIG_MQ_QUEUE_FULL]
meaning = "Nack, rejected."

[ER_SPRIG_MQ_MESSAGE_TOO_LARGE]
meaning = "406, amqp:message-size-exceeded."

[ER_SPRIG_MQ_ALREADY_SETTLED]
meaning = "Ack in a transaction of a message already settled or lost to a lease expiry; the transaction rolls back."

[ER_SPRIG_MQ_DELIVERY_TOKEN_INVALID]
meaning = "Malformed or forged delivery token."

[ER_SPRIG_MQ_OWNER_MOVED]
meaning = "Owner changed during a call (retryable, 40001)."

[ER_SPRIG_MQ_CONFIRM_TIMEOUT]
meaning = "Nack."

[ER_SPRIG_MQ_CONSUMER_TIMEOUT]
meaning = "406, cancel."

[ER_SPRIG_MQ_TXN_NEEDS_XA]
meaning = "Ack in a transaction would add a non-XA cluster under reject."

[ER_SPRIG_MQ_DELAY_OUT_OF_RANGE]
meaning = "406."

[ER_SPRIG_MQ_RESIDENCY]
meaning = "403."

[ER_SPRIG_MQ_QUOTA]
meaning = "Connection.blocked."

[ER_SPRIG_MQ_VHOST_LIMIT]
meaning = "406, 530."

[ER_SPRIG_AMQP_FRAME_ERROR]
meaning = "501, 502, 503, 504, 505."

[ER_SPRIG_AMQP_SASL_FAILED]
meaning = "403, amqp:unauthorized-access."

[ER_SPRIG_AMQP_PROTOCOL_HEADER]
meaning = "Header, close."

[ER_SPRIG_AMQP_CHANNEL_LIMIT]
meaning = "530."

[ER_SPRIG_AMQP10_LINK_REFUSED]
meaning = "Amqp:not-found, amqp:invalid-field."

[ER_SPRIG_AMQP10_UNSUPPORTED]
meaning = "Amqp:not-implemented."

[ER_SPRIG_MQ_STREAM_OFFSET]
meaning = "406."

[ER_SPRIG_MQ_DIRECT_REPLY_TO]
meaning = "406."

[ER_SPRIG_MQ_MGMT_UNSUPPORTED]
meaning = "HTTP 501."

[ER_SPRIG_MQ_DEAD_LETTER_CYCLE]
meaning = "Message dropped in a dead-letter cycle (logged)."

[ER_SPRIG_LOGIN_RATE_LIMITED]
meaning = "More than `auth.ip_failures_per_minute` failed logins from the address on this gateway; refused before the greeting for `auth.ip_block_seconds`."

[ER_SPRIG_AUTH_UNAVAILABLE]
meaning = "Directory or catalog unreadable during login, or hashing slot wait over 2 s."

[ER_SPRIG_REMOTE_ACCESS_DENIED]
meaning = "A pinned tenant's login arrived outside its allowed DCs with `residency.deny_remote_access` on."

[ER_SPRIG_TENANT_SUSPENDED]
meaning = "The tenant (or an ancestor) is suspended; reported after the credentials verify."

[ER_SPRIG_MFA_REQUIRED]
meaning = "A second factor is required: impersonation by an administrator `auth.mfa_required` covers, without one in the session; wire logins under `auth.mfa_wire_logins = token_only`."

[ER_SPRIG_IMPERSONATION_DENIED]
meaning = "Impersonation refused: not an administrator over the user's tenant, the user administers the caller's tenant, `auth.impersonation` off, no reason, too long, or from an impersonation session."

[ER_SPRIG_SESSION_REVOKED]
meaning = "The session's account was dropped or locked (or lost the password method) while connected; sent at the next safe point, then the connection closes (`auth.close_sessions_on_revoke`)."

[ER_SPRIG_OPERATOR_LOGIN_REQUIRED]
meaning = "Named operators are in use: the bootstrap token, the legacy DC-operator token or no credential is refused; log in."

[ER_SPRIG_OPERATOR_MFA_REQUIRED]
meaning = "An operator login needs a TOTP or recovery code."

[ER_SPRIG_OPERATOR_LOGIN_FAILED]
meaning = "Unknown operator, wrong password or code, disabled or locked (one message)."

[ER_SPRIG_OPERATOR_FORBIDDEN]
meaning = "The operator's role, DC or token scopes don't cover the call."

[ER_SPRIG_OPERATOR_EXISTS]
meaning = "An operator of that name exists."

[ER_SPRIG_OPERATOR_NOT_FOUND]
meaning = "No operator or operator token by that name or id."

[ER_SPRIG_OPERATOR_TOKEN_EXPIRED]
meaning = "The operator token is expired or revoked, or its owner disabled; log in again."

[ER_SPRIG_AUTH_PROPAGATION_PENDING]
meaning = "Warning: the change holds in the gateway; MariaDB's grants (or other data centers) haven't applied it yet."

[ER_SPRIG_ROLE_ACTIVATION_TIMEOUT]
meaning = "Combined role not ready."

[ER_SPRIG_TOO_MANY_ROLE_SETS]
meaning = "Too many active-role sets."

[ER_SPRIG_GRANT_TARGET_MISMATCH]
meaning = "Role cycle; wrong resource kind."

[ER_SPRIG_REDIS_ACL_UNSUPPORTED]
meaning = "Redis rule SprigDB can't represent."

[ER_SPRIG_GRANT_OUTSIDE_SUBTREE]
meaning = "Grant up or sideways the tree."

[ER_SPRIG_TENANT_NOT_IN_SUBTREE]
meaning = "USE TENANT or management outside the subtree."

[ER_SPRIG_TENANT_EXISTS]
meaning = "Tenant name taken by another tenant (the `tenant-names/` guard)."

[ER_SPRIG_TENANT_MOVE_BLOCKED]
meaning = "Move would strand foreign grants or shares."

[ER_SPRIG_TENANT_HAS_CHILDREN]
meaning = "Delete of a tenant that has children (`child_count` > 0); delete them first."

[ER_SPRIG_RLS_CHECK_FAILED]
meaning = "A new row version fails a row-level security policy's `WITH CHECK`, or an upsert's or `REPLACE`'s conflicting row fails `USING`; raised by MariaDB's triggers."

[ER_SPRIG_RLS_POLICY_INVALID]
meaning = "A policy expression is non-deterministic, reads a variable or parameter, names an internal object or system schema, calls a stored or unknown function, or uses a session function not available yet."

[ER_SPRIG_RLS_POLICY_CYCLE]
meaning = "Policy subqueries form a cycle."

[ER_SPRIG_RLS_UNSUPPORTED]
meaning = "A statement can't be policed exactly (`LOAD DATA ... REPLACE`, `HANDLER`, `EXPLAIN`, views and stored code over protected tables, statements that don't parse), writes before MariaDB's checks are deployed, or the authorization engine returns a row filter the gateway can't inject yet."

[ER_SPRIG_DEFINER_REFUSED]
meaning = "A stored program wasn't recorded with the session's backend account as its definer; the gateway dropped it again."

[ER_SPRIG_AUTHORIZER_UNKNOWN_TO_GATEWAYS]
meaning = "A change of `auth.authorizer` names an engine some live gateway doesn't list in its registration record; the message names the gateways and their DCs; upgrade them first."

[ER_SPRIG_RLS_DEFINER_DEFAULT]
meaning = "Note-level warning: a `CREATE PROCEDURE` or `CREATE FUNCTION` without `SQL SECURITY` names policy-protected tables, so it runs as `DEFINER` and applies its definer's policies; the message names the tables."

[ER_SPRIG_UNSUPPORTED_KEY_TYPE]
meaning = "A key part has a type that cannot be a key."

[ER_SPRIG_UNSUPPORTED_KEY_COLLATION]
meaning = "A string key uses an unsupported collation."

[ER_SPRIG_STALE_EPOCH]
meaning = "An internal request names an older epoch."

[ER_SPRIG_SHARD_MAP_UNAVAILABLE]
meaning = "No cached map, etcd unreachable (08S01)."

[ER_SPRIG_KEY_CHANGE_TOO_LARGE]
meaning = "A key update would move too many rows."

[ER_SPRIG_KEY_VALUE_UNROUTABLE]
meaning = "A key value can't be normalized (string not valid in or convertible to the key's character set, unparsable number); the router scatters it."

[ER_SPRIG_PIN_CONFLICT]
meaning = "A pin contradicts another pin or a key rule (a column type a key can't use, a `COLOCATE` cycle, a co-located table whose columns don't match the group's key, a parent pinned `UNSHARDED` or `REFERENCE`)."

[ER_SPRIG_PIN_NEEDS_REKEY]
meaning = "In R1, a pin that would change the key or group of a table whose group has already split."

[ER_SPRIG_STATEMENT_NOT_DISTRIBUTABLE]
meaning = "HY000."

[ER_SPRIG_PLAN_LIMIT_EXCEEDED]
meaning = "HY000."

[ER_SPRIG_ROUTER_MEMORY_LIMIT]
meaning = "HY000."

[ER_SPRIG_SHARD_UNAVAILABLE]
meaning = "HY000."

[ER_SPRIG_SHARD_MAP_CHANGED]
meaning = "40001."

[ER_SPRIG_EXPLAIN_NOTE]
meaning = "HY000."

[ER_SPRIG_CROSS_CLUSTER_WRITE_REJECTED]
meaning = "HY000."

[ER_SPRIG_COMMIT_OUTCOME_UNKNOWN]
meaning = "08S01."

[ER_SPRIG_PARTIAL_COMMIT]
meaning = "HY000."

[ER_SPRIG_DTX_ROLLED_BACK]
meaning = "40001."

[ER_SPRIG_TOO_MANY_BRANCHES]
meaning = "HY000."

[ER_SPRIG_XA_NOT_SUPPORTED]
meaning = "HY000."

[ER_SPRIG_HELD_BRANCH_STATEMENT]
meaning = "R3: a held branch (Sprig 2PC) ran a statement that doesn't replay to the same result (`UUID()`, unseeded `RAND()`, `SYSDATE()`, a variable, `LIMIT` without `ORDER BY` in DML, a binary-protocol write, ...); raised at `COMMIT`, the transaction is rolled back."

[ER_SPRIG_TXN_NOT_IN_DOUBT]
meaning = "No branch of the named distributed transaction is prepared on the data center's clusters (`sprigctl txn show`, `resolve`)."

[ER_SPRIG_HELD_BRANCH_FENCED]
meaning = "R3: the node agent's relay refuses the tenant's connections to this node while it recovers a held branch whose holder was lost (Sprig 2PC's relay fence), or while it starts; retry."

[ER_SPRIG_PHASE2_PENDING]
meaning = "R3: a branch of the session's last distributed commit is still being finished on the cluster the statement needs (phase 2 outran `txn.phase2_wait_ms`, and settling it took longer than `txn.commit_resolve_timeout_ms`); the statement didn't run, retry it."

[ER_SPRIG_ID_BLOCK_UNAVAILABLE]
meaning = "No ID block: catalog unreachable and cached blocks used up."

[ER_SPRIG_LOOKUP_UNAVAILABLE]
meaning = "A lookup shard is unreachable for a claim."

[ER_SPRIG_FK_ACTION_NOT_DISTRIBUTED]
meaning = "A cascading foreign-key action across groups the gateway can't apply: deeper than 15 levels, or a cascaded statement the router can't plan; the statement is rolled back; from 11 November 2026 also `ON DELETE CASCADE`, `SET NULL` or `SET DEFAULT` on a foreign key of an inheritable table."

[ER_SPRIG_ID_VALUE_RESERVED]
meaning = "An explicit `AUTO_INCREMENT` value lies in an ID block another gateway still holds; use a higher value, leave the column out, or retry after the block's lease."

[ER_SPRIG_SHARD_BUSY]
meaning = "A split, merge or move job already holds the shard."

[ER_SPRIG_SPLIT_NOT_ALLOWED]
meaning = "The group isn't active, the range is a single hash, or the split or merge doesn't fit the shard map."

[ER_SPRIG_SHARDED_TENANT_MOVE]
meaning = "A whole-tenant move (to another cluster or DC) of a tenant with table groups: R1 moves its shards one at a time instead."

[ER_SPRIG_DDL_FAILED]
meaning = "A change that removes data ran on some shards and failed on the next; it is finished in the background."

[ER_SPRIG_DDL_UNSUPPORTED]
meaning = "A schema change that can't be distributed across shards in R1."

[ER_SPRIG_DDL_SHARD_DRIFT]
meaning = "A table's shards disagree on its definition before a change; nothing changed."

[ER_SPRIG_META_UNAVAILABLE]
meaning = "DC tier has no quorum."

[ER_SPRIG_DC_FENCED]
meaning = "The tenant's home DC holds no valid DC lease (its permit lapsed or was refused); writes are refused, reads continue."

[ER_SPRIG_SESSION_MOVED]
meaning = "The tenant moved to another DC while the session held temporary tables, locks or XA; reconnect."

[ER_SPRIG_NOT_LEADER]
meaning = "Leader lost its session or token; retry against the new leader."

[ER_SPRIG_FAILOVER_REFUSED]
meaning = "A manual failover can't run: the old home is healthy, the target isn't allowed or lacks a unit, or possible loss wasn't accepted."

[ER_SPRIG_RESIDENCY_INVALID]
meaning = "A residency policy doesn't parse; the message names where."

[ER_SPRIG_RESIDENCY_UNSATISFIABLE]
meaning = "A residency policy allows no active DC within the ancestors' sets, its plan can't comply (a pin outside, no eligible cluster), a child is created outside its parent's set, or a change-feed subscription is registered in a DC the tenant's residency excludes."

[ER_SPRIG_TENANT_DEPTH_EXCEEDED]
meaning = "A create or move would put a tenant deeper than `tenant.max_depth`."

[ER_SPRIG_TENANT_TREE_BUSY]
meaning = "A tree operation on a subtree with an open move (`tree_lock`)."

[ER_SPRIG_FAILOVER_BLOCKED]
meaning = "A cluster failover stopped before promoting: loss estimate over the RPO, diverging replicas, the most advanced replica unable to apply its relay log, writer not confirmed down, or `failover.mode` manual."

[ER_SPRIG_PROVISION_NO_HOSTS]
meaning = "A VM cluster can't be created (too few free hosts in the DC), or a Kubernetes pool is at `maxClusters`."

[ER_SPRIG_NO_DC_CAPACITY]
meaning = "No data center a new tenant's residency allows is active with a placeable cluster and a fresh `dc-load` record."

[ER_SPRIG_RECOVERY_FENCED]
meaning = "A write reached a copy that stays fenced after an outage; retry after re-routing."

[ER_SPRIG_ADMISSION_BACKOFF]
meaning = "A returning DC admits new connections in steps; retry after the 1-5 s delay in the message."

[ER_SPRIG_TENANT_MOVE_REFUSED]
meaning = "A move between DCs can't start: pinned, not active, already there, another move open, no active cluster in the target, or asked outside the home DC."

[ER_SPRIG_TRANSLATE_LIMIT]
meaning = "Lateral apply too large."

[ER_SPRIG_CLAUSE_IGNORED]
meaning = "ENCRYPTION, AUTOEXTEND_SIZE, SECONDARY_ENGINE."

[ER_SPRIG_CURSOR_LIMIT]
meaning = "MongoDB `SprigCursorLimit`: a new cursor past `mongo.max_cursors_per_tenant` or the cursor memory budget."

[ER_SPRIG_DOC_ID_TOO_LONG]
meaning = "MongoDB `SprigDocIdTooLong`: the encoded `_id` is over 1024 bytes."

[ER_SPRIG_DOC_FEATURE_UNSUPPORTED]
meaning = "MongoDB `SprigDocFeatureUnsupported`: `$where`, `mapReduce`, capped and time-series collections, and features not in this release."

[ER_SPRIG_PATH_PUBLISH_TIMEOUT]
meaning = "MongoDB `SprigPathPublishTimeout`: not every gateway confirmed a new array path within `doc.path_publish_timeout_ms`; nothing of the write committed (retryable)."

[ER_SPRIG_DOC_TOO_DEEP]
meaning = "MongoDB `SprigDocTooDeep`: a document nested deeper than MariaDB's JSON limit (32 levels)."

[ER_SPRIG_TYPE_NOT_FOUND]
meaning = "Unknown type."

[ER_SPRIG_TYPE_MULTIPLE_INHERITANCE]
meaning = "Two parents."

[ER_SPRIG_TYPE_FIELD_CONFLICT]
meaning = "Field clashes with an inherited one."

[ER_SPRIG_TYPE_ABSTRACT]
meaning = "Insert of an abstract type."

[ER_SPRIG_TYPE_MISMATCH]
meaning = "Upsert meets an unrelated type."

[ER_SPRIG_TYPE_COLUMN_READ_ONLY]
meaning = "Write to a type or path column."

[ER_SPRIG_TYPE_KEY_UPDATE]
meaning = "Key update on a typed or hierarchical row."

[ER_SPRIG_TYPE_HAS_DEPENDENTS]
meaning = "Drop without CASCADE."

[ER_SPRIG_TYPE_PATH_TOO_LONG]
meaning = "Path over 255 characters."

[ER_SPRIG_TYPE_VALIDATION_FAILED]
meaning = "Schema failure (MongoDB: 121)."

[ER_SPRIG_TYPE_UNSUPPORTED]
meaning = "A non-goal."

[ER_SPRIG_HIERARCHY_CYCLE]
meaning = "Move under own descendant."

[ER_SPRIG_HIERARCHY_PARENT_NOT_FOUND]
meaning = "Missing parent."

[ER_SPRIG_HIERARCHY_TOO_DEEP]
meaning = "Depth or path length."

[ER_SPRIG_HIERARCHY_HAS_CHILDREN]
meaning = "Delete under RESTRICT."

[ER_SPRIG_SUBTREE_TOO_LARGE]
meaning = "Over hierarchy.max_move_rows."

[ER_SPRIG_HIERARCHY_BACKFILL_FAILED]
meaning = "Orphans or cycles."

[ER_SPRIG_TYPE_DISCRIMINATOR_MISMATCH]
meaning = "A discriminator value contradicts the subtype written to, or another subtype already declares it."

[ER_SPRIG_KV_NAMESPACE_NOT_FOUND]
meaning = "NOT_FOUND."

[ER_SPRIG_KV_VERSION_MISMATCH]
meaning = "FAILED_PRECONDITION, with the current version."

[ER_SPRIG_KV_KEY_EXISTS]
meaning = "ALREADY_EXISTS."

[ER_SPRIG_KV_INVALID_KEY]
meaning = "INVALID_ARGUMENT."

[ER_SPRIG_KV_VALUE_INVALID]
meaning = "INVALID_ARGUMENT (size, codec, schema)."

[ER_SPRIG_KV_TARGET_EXISTS]
meaning = "ALREADY_EXISTS."

[ER_SPRIG_KV_SUBTREE_TOO_LARGE]
meaning = "FAILED_PRECONDITION."

[ER_SPRIG_KV_TXN_TOO_LARGE]
meaning = "INVALID_ARGUMENT."

[ER_SPRIG_KV_FILTER_UNSUPPORTED]
meaning = "INVALID_ARGUMENT."

[ER_SPRIG_KV_SQL_READ_ONLY]
meaning = "FAILED_PRECONDITION."

[ER_SPRIG_KV_WRONG_TYPE]
meaning = "FAILED_PRECONDITION; Redis `WRONGTYPE`."

[ER_SPRIG_KV_ELEMENT_TOO_LONG]
meaning = "INVALID_ARGUMENT: a field or member over 2024 bytes."

[ER_SPRIG_DIM_MODEL_NOT_FOUND]
