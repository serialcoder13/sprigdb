# CI stages of chapter 46 ("Flows"):
#
#   S0  every push and pull request   rustfmt, clippy, unit tests, cargo deny,
#                                     Compose files validated
#   S1  pull requests, main           integration tests against Compose (all
#                                     single-DC profiles, plus toxiproxy,
#                                     faultd and elle-cli), SPRIG_TEST_* set;
#                                     simulations, 200 seeds per suite
#                                     (5,000 nightly), tokio's RNG seeded
#   S2  nightly and on demand         the three-DC layout with netem latency;
#                                     the same suites against it, on MariaDB
#                                     11.8 and 12.3
#
# Integration tests skip themselves when their SPRIG_TEST_* variable is
# unset (sprig-testkit's `require_env!`). S1 and S2 set SPRIG_TEST_STRICT=1,
# which turns a skip into a failure, so a suite can't silently stop running.
# Later stages (S3 nightly suites, S4 release candidates) come with the
# suites they run.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # S2, nightly

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------- S0 ----
  fmt:
    name: S0 rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: S0 clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: S0 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo build --workspace --locked
      # No SPRIG_TEST_* variables: integration tests skip themselves.
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - run: cargo test --workspace --locked --doc

  deny:
    name: S0 cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  compose:
    name: S0 compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every profile and the three-DC layout
        working-directory: deploy/compose
        run: |
          for p in single replication galera all faults elle connectors; do
            docker compose --profile "$p" config --quiet
          done
          ./3dc.sh config --quiet

  # ---------------------------------------------------------------- S1 ----
  integration:
    name: S1 integration (Compose, one DC)
    needs: [fmt, clippy, test, compose]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPRIG_TEST_STRICT: "1"
      SPRIG_TEST_DOCKER: "1"
      SPRIG_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
      SPRIG_TEST_ETCD: http://127.0.0.1:2379
      SPRIG_TEST_MARIADB_SINGLE: mysql://root:sprig-dev-root@127.0.0.1:13301
      SPRIG_TEST_MARIADB_REPLICATION: mysql://root:sprig-dev-root@127.0.0.1:13311,mysql://root:sprig-dev-root@127.0.0.1:13312,mysql://root:sprig-dev-root@127.0.0.1:13313
      SPRIG_TEST_MARIADB_GALERA: mysql://root:sprig-dev-root@127.0.0.1:13321,mysql://root:sprig-dev-root@127.0.0.1:13322,mysql://root:sprig-dev-root@127.0.0.1:13323
      # Fault injection and Elle (chapter 46, step 3).
      SPRIG_TEST_TOXIPROXY: http://127.0.0.1:18474
      SPRIG_TEST_FAULTD: sprigdb-dev-faultd-1
      SPRIG_TEST_ELLE: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Build while Compose starts.
      - name: Start Compose (all profiles)
        working-directory: deploy/compose
        run: docker compose --profile all up -d
      - name: Start toxiproxy and faultd, build elle-cli
        working-directory: deploy/compose
        run: |
          docker compose --profile faults up -d --build toxiproxy faultd
          docker compose --profile elle build elle
      - run: cargo build --workspace --all-targets --locked
      - name: Wait for every service to be healthy
        working-directory: deploy/compose
        run: docker compose --profile all up -d --wait --wait-timeout 300
      - run: cargo nextest run --workspace --locked --no-fail-fast --no-tests=pass
      - name: Collect Compose logs
        if: failure()
        working-directory: deploy/compose
        run: |
          mkdir -p "$SPRIG_TEST_LOG_DIR"
          docker compose --profile all --profile faults ps --all > "$SPRIG_TEST_LOG_DIR/compose-ps.txt"
          docker compose --profile all --profile faults logs --no-color --timestamps > "$SPRIG_TEST_LOG_DIR/compose.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: s1-logs
          path: target/test-logs
          if-no-files-found: ignore
      - name: Stop Compose
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile all --profile faults down -v --timeout 10

  simulation:
    name: S1 simulation (seeded)
    needs: [fmt, clippy, test]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # tokio_unstable lets the harness seed tokio's own random choices
      # (select! order), so a trace mismatch on rerun fails the run.
      RUSTFLAGS: --cfg tokio_unstable -D warnings
      SPRIG_SIM_SEEDS: ${{ github.event_name == 'schedule' && '5000' || '200' }}
      SPRIG_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: tokio-unstable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # No SPRIG_TEST_* variables: only the simulations and unit tests run.
      - run: cargo nextest run -p sprig-testkit --locked --no-tests=pass
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sim-regressions
          path: target/test-logs
          if-no-files-found: ignore

  # ---------------------------------------------------------------- S2 ----
  three-dc:
    name: S2 three DCs (${{ matrix.mariadb }})
    needs: [integration]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["mariadb:11.8", "mariadb:12.3"]
    env:
      MARIADB_IMAGE: ${{ matrix.mariadb }}
      SPRIG_TEST_STRICT: "1"
      SPRIG_TEST_DOCKER: "1"
      SPRIG_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
      SPRIG_TEST_ENV_FILE: deploy/compose/env.3dc.toml
      # The single-DC variables, pointed at the three-DC layout, so every
      # suite also runs there: mum1's DC etcd, iad1 single, mum1 primary +
      # replicas, fra1 Galera.
      SPRIG_TEST_ETCD: http://127.0.0.1:34179
      SPRIG_TEST_MARIADB_SINGLE: mysql://root:sprig-dev-root@127.0.0.1:34306
      SPRIG_TEST_MARIADB_REPLICATION: mysql://root:sprig-dev-root@127.0.0.1:34106,mysql://root:sprig-dev-root@127.0.0.1:34107,mysql://root:sprig-dev-root@127.0.0.1:34108
      SPRIG_TEST_MARIADB_GALERA: mysql://root:sprig-dev-root@127.0.0.1:34206,mysql://root:sprig-dev-root@127.0.0.1:34207,mysql://root:sprig-dev-root@127.0.0.1:34208
      # toxiproxy joins the three-DC network, in front of iad1's single node.
      SPRIG_TEST_TOXIPROXY: http://127.0.0.1:18474
      SPRIG_TEST_TOXIPROXY_UPSTREAM: iad1-db-1:3306
      SPRIG_TEST_FAULTD: sprigdb-dev-faultd-1
      SPRIG_TEST_ELLE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Load the netem qdisc module
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Start the three-DC layout
        run: deploy/compose/3dc.sh up -d --build
      - name: Start toxiproxy (on the three-DC network) and faultd, build elle-cli
        run: |
          docker run -d --name sprig-ci-toxiproxy --network sprigdb-3dc_wan \
            -p 127.0.0.1:18474:8474 -p 127.0.0.1:13400-13419:13400-13419 \
            ghcr.io/shopify/toxiproxy:2.12.0
          docker compose -f deploy/compose/compose.yaml --profile faults up -d --build faultd
          docker compose -f deploy/compose/compose.yaml --profile elle build elle
      - run: cargo build --workspace --all-targets --locked
      - name: Wait for every service to be healthy
        run: deploy/compose/3dc.sh up -d --wait --wait-timeout 600
      - name: Check inter-DC latency
        run: |
          deploy/compose/3dc.sh latency | tee target-latency.txt
          # Each added round trip must show up: at least 95% of it, at most
          # 50 ms over (shared runners are noisy).
          awk 'NR > 1 && $2 > 0 {
                 if ($4 == "?" || $4 < $2 * 0.95 || $4 > $2 + 50) {
                   print "latency out of range: " $0; bad = 1 } }
               END { exit bad }' target-latency.txt
      - run: cargo nextest run --workspace --locked --no-fail-fast --no-tests=pass
      - name: Collect Compose logs
        if: failure()
        run: |
          mkdir -p "$SPRIG_TEST_LOG_DIR"
          deploy/compose/3dc.sh ps --all > "$SPRIG_TEST_LOG_DIR/3dc-ps.txt"
          deploy/compose/3dc.sh logs --no-color --timestamps > "$SPRIG_TEST_LOG_DIR/3dc.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: s2-logs-${{ strategy.job-index }}
          path: target/test-logs
          if-no-files-found: ignore
      - name: Stop the three-DC layout
        if: always()
        run: |
          docker rm -f sprig-ci-toxiproxy || true
          docker compose -f deploy/compose/compose.yaml --profile faults down --timeout 10 || true
          deploy/compose/3dc.sh down -v --timeout 10

  # ------------------------------------------------------- M0.2 gate ----
  # Milestone M0.2's "done when" (chapter 48): the tier 1 connectors and
  # sysbench pass through the gateway on 3306 (persona mysql) and 3307
  # (persona mariadb), and the gateway adds at most 0.5 ms at p50 over
  # direct MariaDB. The harness is deploy/compose/connectors (README there);
  # it already passes against MariaDB 11.8 and MySQL 8.4 directly.
  #
  # Disabled until the gateway serves the MySQL protocol (chapter 05, build
  # step 13). To enable: drop `if: false` (or narrow it, e.g. to
  # workflow_dispatch and schedule), and replace the "Start the gateway"
  # step with however the gateway is configured then; per-target outcomes go
  # in an overlay file named by SPRIG_CONN_EXPECTED_OVERLAY.
  connectors:
    name: M0.2 connector matrix and latency gate (gateway)
    needs: [integration]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPRIG_TEST_DOCKER: "1"
      SPRIG_TEST_CONNECTORS: 127.0.0.1:3306:mysql,127.0.0.1:3307:mariadb
      SPRIG_TEST_LATENCY_TARGET: mysql://root:sprig-dev-root@127.0.0.1:3307
      SPRIG_TEST_LATENCY_BASELINE: mysql://root:sprig-dev-root@127.0.0.1:13301
      SPRIG_TEST_LATENCY_SAMPLES: "5000"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start Compose (one node) and build the connector images
        working-directory: deploy/compose
        run: |
          docker compose --profile single up -d --wait --wait-timeout 300
          docker compose --profile connectors build --quiet
      - run: cargo build --release --locked -p sprigdb
      - name: Start the gateway
        run: |
          # Placeholder until chapter 04/05 settle the gateway's settings:
          # listeners on 3306 (mysql) and 3307 (mariadb), backed by the
          # Compose single node.
          SPRIGDB_NODE_DC=dc-a target/release/sprigdb --config deploy/compose/sprigdb.dev.toml gateway \
            > target/gateway.log 2>&1 &
          for port in 3306 3307; do
            timeout 60 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done"
          done
      - name: Connector matrix and sysbench, both ports
        run: cargo test --release --locked -p sprig-testkit --test connectors_matrix -- --ignored --nocapture
      - name: Latency gate (3307 against direct MariaDB)
        run: cargo test --release --locked -p sprig-testkit --test latency_gate -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-connectors
          path: |
            deploy/compose/connectors/results
            target/gateway.log
          if-no-files-found: ignore
      - name: Stop Compose
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile single down -v --timeout 10

  # M0.3 "done when" (chapter 48): two tenants on one cluster run the same
  # schema-tool suite (Flyway, Hibernate validation, mysqldump and
  # mariadb-dump) and see only their own objects; no physical name reaches a
  # client in the leak suite; an object-scope setting is live within seconds
  # and an out-of-bounds value is refused with 39080. The harness is
  # deploy/compose/m03 (README there); its baseline mode already passes
  # against MariaDB 11.8 directly.
  #
  # Disabled until the gateway serves M0.3's tenants (the catalog, name
  # virtualization and SPRIG SET). To enable: drop `if: false`. gateway-dev.sh
  # up provisions the tenants itself (acme and globex on dc-a-single, users
  # acme.app and globex.app with password sprig-dev-app).
  m03:
    name: M0.3 tenants, names and settings (gateway)
    needs: [integration]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPRIG_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start Compose (etcd + one node) and build the m03 images
        working-directory: deploy/compose
        run: |
          docker compose --profile m03 config --quiet
          docker compose --profile single up -d --wait --wait-timeout 300
          docker compose --profile m03 pull --quiet m03-flyway
          docker compose --profile m03 build --quiet m03-hibernate m03-mysql-cli m03-mariadb-cli
      - run: cargo build --locked -p sprigdb -p sprigctl
      - run: cargo test --locked -p sprig-testkit --test m03_leaks --test m03_settings --no-run
      - name: Baseline (direct MariaDB) proves the harness
        run: |
          for persona in mariadb mysql; do
            SPRIG_M03_MODE=baseline SPRIG_M03_BUILD=0 \
              deploy/compose/m03/run.sh 127.0.0.1 13301 "$persona" m03_acme m03_globex sprig-dev-app
          done
      - name: Start the gateway
        run: deploy/compose/gateway-dev.sh up
      - name: M0.3 harness, both ports
        run: |
          export SPRIG_M03_BUILD=0 SPRIG_M03_BACKEND=mysql://root:sprig-dev-root@127.0.0.1:13301
          deploy/compose/m03/run.sh 127.0.0.1 13307 mariadb acme.app globex.app sprig-dev-app
          deploy/compose/m03/run.sh 127.0.0.1 13306 mysql acme.app globex.app sprig-dev-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m03-harness
          path: |
            deploy/compose/m03/results
            deploy/compose/.gateway-dev/*.log
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: |
          deploy/compose/gateway-dev.sh down || true
          docker compose --project-directory deploy/compose --profile single down -v --timeout 10

  # Milestone M0.4's "done when" (chapter 48): chapter 13's scenario suite on
  # the three reference topologies (an index proposed, validated and built
  # for each worked example; the ORDER BY ... LIMIT trap rejected and its
  # covering retry built; a user index retiring ours; an unused automatic
  # index dropped while user and migrated indexes stay) and the drift suite
  # (Flyway, Hibernate and the dumps see no sprig_auto_). The harness is
  # deploy/compose/m04 (README there).
  #
  # Disabled: it needs all three topologies (about 7 GB with the Compose
  # memory caps) and 30 to 40 minutes. To enable: drop `if: false`, or
  # narrow it to workflow_dispatch and schedule.
  m04:
    name: M0.4 automatic indexing scenarios (gateway, three topologies)
    needs: [integration]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SPRIG_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start Compose (etcd and every topology) and build the m03 images
        working-directory: deploy/compose
        run: |
          docker compose --profile all up -d --wait --wait-timeout 600
          docker compose --profile m03 pull --quiet m03-flyway
          docker compose --profile m03 build --quiet m03-hibernate m03-mysql-cli m03-mariadb-cli
      - run: cargo build --locked -p sprigdb -p sprigctl
      - run: cargo test --locked -p sprig-testkit --test m04_scenarios --no-run
      - name: Start the gateway and the m04 tenants
        run: |
          deploy/compose/gateway-dev.sh up
          deploy/compose/m04/run.sh setup
      - name: Scenarios, one topology at a time
        run: deploy/compose/m04/run.sh all
      - name: Drift suite
        run: SPRIG_M03_BUILD=0 deploy/compose/m04/run.sh drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-scenarios
          path: |
            deploy/compose/m04/results
            deploy/compose/.gateway-dev/*.log
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: |
          deploy/compose/m04/run.sh teardown || true
          deploy/compose/gateway-dev.sh down || true
          docker compose --project-directory deploy/compose --profile all down -v --timeout 10
