{{- /* The controller role (chapter 27, "How the roles deploy on Kubernetes"). */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprigdb-controller
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: controller}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "sprigdb.podSecurity" . | nindent 6 }}
      containers:
        - name: controller
          image: {{ include "sprigdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["controller", "--config", "/etc/sprigdb/config/sprigdb.toml"]
          env:
            - name: SPRIGDB_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: admin, containerPort: 7480}
            - {name: internal, containerPort: 7400}
            - {name: telemetry, containerPort: 9180}
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
          livenessProbe:
            httpGet: {path: /healthz, port: telemetry}
            periodSeconds: 5
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            {{- include "sprigdb.tlsMounts" . | nindent 12 }}
            # Every cluster's system-account credentials, written by the
            # operator; updated in place, re-read at each connection.
            - {name: creds, mountPath: /etc/sprigdb/creds, readOnly: true}
      volumes:
        {{- include "sprigdb.tlsVolumes" (dict "root" . "role" "controller" "secret" "sprigdb-controller-tls") | nindent 8 }}
        - name: creds
          secret: {secretName: sprigdb-cluster-credentials, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-controller
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/component: controller}
  ports:
    - {name: admin, port: 7480}
    - {name: internal, port: 7400}
