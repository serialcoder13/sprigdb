{{- /* The operator: the only role with Kubernetes RBAC, limited to this
     namespace; two replicas elect through a Lease (chapter 27). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sprigdb-operator
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sprigdb-operator
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
rules:
  - apiGroups: [sprigdb.io]
    resources: [sprigclusters, sprigclusterpools, sprigclusters/status, sprigclusterpools/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [k8s.mariadb.com]
    resources: [mariadbs, physicalbackups, pointintimerecoveries]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # delete: retire removes mariadb-operator's generated password Secrets.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
  # retire deletes a retired cluster's volume claims.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sprigdb-operator
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sprigdb-operator}
subjects:
  - {kind: ServiceAccount, name: sprigdb-operator, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprigdb-operator
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: operator}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      serviceAccountName: sprigdb-operator
      {{- include "sprigdb.podSecurity" . | nindent 6 }}
      containers:
        - name: operator
          image: {{ include "sprigdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["operator", "--config", "/etc/sprigdb/config/sprigdb.toml"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: SPRIGDB_NODE_DC, value: {{ .Values.dc.id | quote }}}
            - {name: SPRIG_OPERATOR_CONTROLLER_ADMIN, value: {{ .Values.operator.controllerAdmin | default (printf "http://sprigdb-controller.%s.svc:7480" .Release.Namespace) | quote }}}
            - {name: SPRIG_OPERATOR_NODE_SERVICE_TYPE, value: {{ .Values.nodeServices.type | quote }}}
            {{- with .Values.nodeServices.nodePortHost }}
            - {name: SPRIG_OPERATOR_NODE_PORT_HOST, value: {{ . | quote }}}
            {{- end }}
            - {name: SPRIG_OPERATOR_SERVER_CERT_ISSUER, value: {{ .Values.tls.issuerRef.name | quote }}}
            - {name: SPRIG_OPERATOR_CLIENT_CERT_ISSUER, value: {{ .Values.tls.issuerRef.name | quote }}}
            - {name: SPRIG_OPERATOR_MARIADB_CA_FILE, value: /etc/sprigdb/ca/ca.crt}
            - {name: SPRIG_OPERATOR_READY_TIMEOUT_SECONDS, value: {{ .Values.operator.readyTimeoutSeconds | quote }}}
            {{- if .Values.operator.agentSidecar }}
            - {name: SPRIG_OPERATOR_AGENT_IMAGE, value: {{ include "sprigdb.image" . | quote }}}
            {{- end }}
            - name: SPRIG_OPERATOR_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: sprigdb-admin-token, key: token, optional: true}}
          ports:
            - {name: telemetry, containerPort: 9180}
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
          livenessProbe:
            httpGet: {path: /healthz, port: telemetry}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            {{- include "sprigdb.tlsMounts" . | nindent 12 }}
      volumes:
        {{- include "sprigdb.tlsVolumes" (dict "root" . "role" "controller" "secret" "sprigdb-operator-tls") | nindent 8 }}
