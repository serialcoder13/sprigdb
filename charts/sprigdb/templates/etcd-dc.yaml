{{- /* The DC tier: 3 or 5 members across zones, PodDisruptionBudget maxUnavailable 1. */}}
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-etcd-dc
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/component: etcd-dc}
  ports:
    - {name: client, port: 2379}
    - {name: peer, port: 2380}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sprigdb-etcd-dc
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  serviceName: sprigdb-etcd-dc
  replicas: {{ .Values.etcd.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/component: etcd-dc}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: etcd-dc
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/component: etcd-dc}}
      containers:
        - name: etcd
          image: {{ .Values.etcd.image }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd
            - --auto-compaction-mode={{ .Values.etcd.autoCompaction.mode }}
            - --auto-compaction-retention={{ .Values.etcd.autoCompaction.retention }}
            - --listen-client-urls={{ $s := ternary "https" "http" .Values.tls.enabled }}{{ $s }}://0.0.0.0:2379
            - --advertise-client-urls={{ $s }}://$(POD_NAME).sprigdb-etcd-dc.{{ .Release.Namespace }}.svc:2379
            - --listen-peer-urls={{ $s }}://0.0.0.0:2380
            - --initial-advertise-peer-urls={{ $s }}://$(POD_NAME).sprigdb-etcd-dc.{{ .Release.Namespace }}.svc:2380
            - --initial-cluster={{- range $i, $_ := until (int .Values.etcd.replicas) -}}{{ if $i }},{{ end }}sprigdb-etcd-dc-{{ $i }}={{ $s }}://sprigdb-etcd-dc-{{ $i }}.sprigdb-etcd-dc.{{ $.Release.Namespace }}.svc:2380{{- end }}
            - --initial-cluster-state=new
            {{- if .Values.tls.enabled }}
            - --client-cert-auth
            - --trusted-ca-file=/etc/etcd/ca/ca.crt
            - --cert-file=/etc/etcd/tls/tls.crt
            - --key-file=/etc/etcd/tls/tls.key
            - --peer-client-cert-auth
            - --peer-trusted-ca-file=/etc/etcd/ca/ca.crt
            - --peer-cert-file=/etc/etcd/tls/tls.crt
            - --peer-key-file=/etc/etcd/tls/tls.key
            {{- end }}
          ports:
            - {name: client, containerPort: 2379}
            - {name: peer, containerPort: 2380}
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /etc/etcd/tls, readOnly: true}
            - {name: ca, mountPath: /etc/etcd/ca, readOnly: true}
            {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret: {secretName: sprigdb-etcd-dc-tls}
        - name: ca
          configMap: {name: {{ .Values.tls.bundleConfigMap }}}
      {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.etcd.storage }}}}
