{{- /* Initial global and dc settings, the gateway's optional listeners,
     its certificate and client-certificate checks, applied after each
     install and upgrade. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: sprigdb-settings-{{ .Release.Revision }}
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      # The chart's labels: the controller NetworkPolicy admits only
      # SprigDB's own pods to the Admin port.
      labels:
        app.kubernetes.io/component: settings
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Kubernetes' service-link variables (SPRIGDB_CONTROLLER_PORT=tcp://...)
      # read as SPRIGDB_<SECTION>_<KEY> configuration and stop the process.
      enableServiceLinks: false
      volumes:
        - name: admin-token
          secret: {secretName: sprigdb-admin-token}
        {{- if .Values.tls.enabled }}
        - name: ca-bundle
          configMap: {name: {{ .Values.tls.bundleConfigMap }}}
        {{- end }}
      containers:
        - name: settings
          image: {{ include "sprigdb.image" . }}
          command: ["/bin/sh", "-c"]
          env:
            - {name: SPRIGCTL_TOKEN_FILE, value: /etc/sprigdb/admin/token}
            {{- if .Values.tls.enabled }}
            - {name: SPRIGCTL_CA_FILE, value: /etc/sprigdb/ca/ca.crt}
            {{- end }}
          volumeMounts:
            - {name: admin-token, mountPath: /etc/sprigdb/admin, readOnly: true}
            {{- if .Values.tls.enabled }}
            - {name: ca-bundle, mountPath: /etc/sprigdb/ca, readOnly: true}
            {{- end }}
          args:
            - |
              set -e
              E={{ include "sprigdb.adminEndpoint" . }}
              # Calls only the DC leader serves (settings, for example) are
              # refused by the other controllers with 39504, naming the
              # leader: send them again to the leader's own address under
              # the headless Service.
              ctl() {
                if out=$(sprigctl --endpoint "$E" "$@" 2>&1); then
                  [ -z "$out" ] || printf '%s\n' "$out"
                  return 0
                fi
                leader=$(printf '%s\n' "$out" | sed -n 's/.*send the request to the leader, \([A-Za-z0-9._-]*\).*/\1/p' | head -n 1)
                if [ -n "$leader" ]; then
                  sprigctl --endpoint "{{ include "sprigdb.adminScheme" . }}://$leader.sprigdb-controller-pods.{{ .Release.Namespace }}.svc:7480" "$@"
                  return
                fi
                printf '%s\n' "$out" >&2
                return 1
              }
              # The controller may still be starting: the Job retries.
              ctl dc list > /dev/null
              {{- $tags := list }}
              {{- range $k, $v := .Values.dc.tags }}{{ $tags = append $tags (printf "%s=%s" $k (toString $v)) }}{{ end }}
              ctl dc register {{ .Values.dc.id }}{{ if $tags }} --tags {{ join "," $tags | squote }}{{ end }} || true
              {{- range $k, $v := .Values.settings.global }}
              ctl settings set {{ $k }} {{ $v | quote }} --scope global --reason helm
              {{- end }}
              {{- range $name := splitList "," (include "sprigdb.optionalListeners" .) }}
              {{- $l := get ($.Values.gateway.listeners | default dict) $name | default dict }}
              ctl settings set listener.{{ $name }}.enabled {{ $l.enabled | default false | quote }} --scope dc:{{ $.Values.dc.id }} --reason helm
              {{- if $l.enabled }}
              ctl settings set listener.{{ $name }}.bind "0.0.0.0:{{ $l.port }}" --scope dc:{{ $.Values.dc.id }} --reason helm
              {{- end }}
              {{- end }}
              {{- with (.Values.gateway.clientTls | default dict) }}
              {{- if .secretName }}
              ctl settings set tls.bundles.default.cert_path "{{ .mountPath | default "/etc/sprigdb/client-tls" }}/tls.crt" --scope dc:{{ $.Values.dc.id }} --reason helm
              ctl settings set tls.bundles.default.key_path "{{ .mountPath | default "/etc/sprigdb/client-tls" }}/tls.key" --scope dc:{{ $.Values.dc.id }} --reason helm
              {{- end }}
              {{- end }}
              {{- $caPath := include "sprigdb.clientCaPath" . }}
              {{- if and (include "sprigdb.anyClientCert" .) (not $caPath) }}
              {{- fail "gateway.clientTls.clientCert asks for client certificates: name the CA that signs them in gateway.clientTls.clientCa (secretName or configMap)" }}
              {{- end }}
              {{- /* Client certificates are the chart's only when
                   gateway.clientTls.clientCa is configured: then the CA path
                   and every listener's mode are set (off included). Without
                   a CA nothing is written, so values set by hand at the DC's
                   scope survive upgrades. */}}
              {{- if $caPath }}
              ctl settings set tls.bundles.default.client_ca_path "{{ $caPath }}" --scope dc:{{ $.Values.dc.id }} --reason helm
              {{- range $name := splitList "," (include "sprigdb.allListeners" .) }}
              ctl settings set listener.{{ $name }}.client_cert {{ include "sprigdb.clientCert" (dict "root" $ "name" $name) }} --scope dc:{{ $.Values.dc.id }} --reason helm
              {{- end }}
              {{- end }}
              {{- range $k, $v := .Values.settings.dc }}
              ctl settings set {{ $k }} {{ $v | quote }} --scope dc:{{ $.Values.dc.id }} --reason helm
              {{- end }}
