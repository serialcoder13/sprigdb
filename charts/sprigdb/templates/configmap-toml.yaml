{{- /* sprigdb.toml per role: the small process file; everything else is
     live settings. */ -}}
{{- range $role := list "controller" "gateway" "worker" "agent" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sprigdb-{{ $role }}
  labels: {{- include "sprigdb.labels" $ | nindent 4 }}
data:
  sprigdb.toml: |
    [node]
    dc = "{{ $.Values.dc.id }}"
    [meta]
    dc_seeds = {{ include "sprigdb.dcSeeds" $ }}
    global_seeds = {{ $.Values.global.endpoints | toJson }}
    deployment_id = "{{ $.Values.deploymentId }}"
    {{- if $.Values.tls.enabled }}
    [tls]
    ca = "/etc/sprigdb/ca/ca.crt"
    cert = "/etc/sprigdb/tls/tls.crt"
    key = "/etc/sprigdb/tls/tls.key"
    {{- end }}
    [telemetry]
    bootstrap_addr = "0.0.0.0:9180"
    {{- if eq $role "gateway" }}
    [gateway]
    backends_file = "/etc/sprigdb/backends/backends.toml"
    {{- end }}
    {{- if eq $role "controller" }}
    [controller]
    global_candidate = {{ $.Values.controller.globalCandidate }}
    bootstrap = {{ $.Values.controller.bootstrap | default false }}
    admin_addr = "0.0.0.0:7480"
    # The Admin API: {{ include "sprigdb.adminScheme" $ }}.
    {{- if $.Values.tls.enabled }}
    {{- if ($.Values.controller.adminApi | default dict).tlsSecret }}
    admin_tls_cert = "/etc/sprigdb/admin-tls/tls.crt"
    admin_tls_key = "/etc/sprigdb/admin-tls/tls.key"
    {{- else }}
    admin_tls_cert = "/etc/sprigdb/tls/tls.crt"
    admin_tls_key = "/etc/sprigdb/tls/tls.key"
    {{- end }}
    {{- end }}
    # Permits, peer pings and observations between controllers; each pod
    # publishes its own IP (SPRIGDB_CONTROLLER_INTERNAL_ADVERTISE).
    internal_addr = "0.0.0.0:7400"
    admin_token_file = "/etc/sprigdb/admin/token"
    {{- end }}
{{- end }}
