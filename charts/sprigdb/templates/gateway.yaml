{{- /* Gateways: Deployment, HorizontalPodAutoscaler, Service; no
     service-account token. */}}
{{- $listeners := .Values.gateway.listeners | default dict }}
{{- $clientTls := .Values.gateway.clientTls | default dict }}
{{- $clientCa := $clientTls.clientCa | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprigdb-gateway
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.autoscaling.minReplicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: gateway}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # Kubernetes' service-link variables (SPRIGDB_CONTROLLER_PORT=tcp://...)
      # read as SPRIGDB_<SECTION>_<KEY> configuration and stop the process.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      {{- include "sprigdb.podSecurity" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "sprigdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The address in this gateway's registration, where other
          # gateways and the workers reach its peer service and Kafka's
          # metadata sends clients: the pod's IP, dashed, under the
          # headless Service sprigdb-gateway-pods (which resolves it, and
          # which the gateway certificate covers). Unset, the gateway would
          # register its hostname, which nothing else resolves.
          command: ["/bin/sh", "-c"]
          args:
            - |
              export SPRIGDB_GATEWAY_ADVERTISE_ADDR="$(printf '%s' "$POD_IP" | tr '.:' '--').sprigdb-gateway-pods.{{ .Release.Namespace }}.svc"
              exec /usr/bin/sprigdb gateway --config /etc/sprigdb/config/sprigdb.toml
          env:
            - name: SPRIGDB_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: mysql, containerPort: 3306}
            - {name: mariadb, containerPort: 3307}
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
            {{- range $name := splitList "," (include "sprigdb.optionalListeners" .) }}
            {{- $l := get $listeners $name | default dict }}
            {{- if $l.enabled }}
            - {name: {{ $name }}, containerPort: {{ $l.port }}}
            {{- end }}
            {{- end }}
            - {name: peer, containerPort: 7403}
            - {name: telemetry, containerPort: 9180}
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
          livenessProbe:
            httpGet: {path: /healthz, port: telemetry}
            periodSeconds: 5
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            {{- include "sprigdb.tlsMounts" . | nindent 12 }}
            # Catalog reads and database DDL run as each cluster's sprig_ctl.
            - {name: creds, mountPath: /etc/sprigdb/creds, readOnly: true}
            - {name: backends, mountPath: /etc/sprigdb/backends, readOnly: true}
            {{- if $clientTls.secretName }}
            # The certificate clients see (gateway.clientTls).
            - {name: client-tls, mountPath: {{ $clientTls.mountPath | default "/etc/sprigdb/client-tls" }}, readOnly: true}
            {{- end }}
            {{- if or $clientCa.secretName $clientCa.configMap }}
            # The CAs that sign client certificates (gateway.clientTls.clientCa).
            - {name: client-ca, mountPath: {{ $clientCa.mountPath | default "/etc/sprigdb/client-ca" }}, readOnly: true}
            {{- end }}
      volumes:
        {{- include "sprigdb.tlsVolumes" (dict "root" . "role" "gateway" "secret" "sprigdb-gateway-tls") | nindent 8 }}
        - name: creds
          secret: {secretName: sprigdb-cluster-credentials, optional: true}
        - name: backends
          secret: {secretName: sprigdb-gateway-backends}
        {{- if $clientTls.secretName }}
        - name: client-tls
          secret: {secretName: {{ $clientTls.secretName }}}
        {{- end }}
        {{- if $clientCa.secretName }}
        - name: client-ca
          secret: {secretName: {{ $clientCa.secretName }}}
        {{- else if $clientCa.configMap }}
        - name: client-ca
          configMap: {name: {{ $clientCa.configMap }}}
        {{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprigdb-gateway
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sprigdb-gateway}
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-gateway
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app.kubernetes.io/component: gateway}
  ports:
    - {name: mysql, port: 3306}
    - {name: mariadb, port: 3307}
    - {name: http, port: 8080}
    - {name: https, port: 8443}
    {{- range $name := splitList "," (include "sprigdb.optionalListeners" .) }}
    {{- $l := get $listeners $name | default dict }}
    {{- if $l.enabled }}
    - {name: {{ $name }}, port: {{ $l.port }}}
    {{- end }}
    {{- end }}
---
# Headless: a DNS name per gateway pod (<pod IP, dashed>.sprigdb-gateway-pods.
# <namespace>.svc), the address each gateway registers. Names are published
# before a pod is ready.
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-gateway-pods
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/component: gateway}
  ports:
    - {name: peer, port: 7403}
---
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-gateway-health
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/component: gateway}
  ports:
    - {name: telemetry, port: 9180}
