{{- /* Gateways: Deployment, HorizontalPodAutoscaler, Service; no
     service-account token (chapter 27). */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprigdb-gateway
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.autoscaling.minReplicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: gateway}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      {{- include "sprigdb.podSecurity" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "sprigdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gateway", "--config", "/etc/sprigdb/config/sprigdb.toml"]
          env:
            - name: SPRIGDB_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: mysql, containerPort: 3306}
            - {name: mariadb, containerPort: 3307}
            - {name: mongodb, containerPort: 27017}
            - {name: redis, containerPort: 6379}
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
            - {name: peer, containerPort: 7403}
            - {name: telemetry, containerPort: 9180}
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
          livenessProbe:
            httpGet: {path: /healthz, port: telemetry}
            periodSeconds: 5
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            {{- include "sprigdb.tlsMounts" . | nindent 12 }}
      volumes:
        {{- include "sprigdb.tlsVolumes" (dict "root" . "role" "gateway" "secret" "sprigdb-gateway-tls") | nindent 8 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprigdb-gateway
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sprigdb-gateway}
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-gateway
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app.kubernetes.io/component: gateway}
  ports:
    - {name: mysql, port: 3306}
    - {name: mariadb, port: 3307}
    - {name: mongodb, port: 27017}
    - {name: redis, port: 6379}
    - {name: http, port: 8080}
    - {name: https, port: 8443}
---
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-gateway-health
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/component: gateway}
  ports:
    - {name: telemetry, port: 9180}
