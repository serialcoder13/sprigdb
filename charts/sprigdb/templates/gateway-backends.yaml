{{- /* The gateways' per-user backend accounts: every gateway
     derives each user's MariaDB password from this one secret, so they
     must share it. Generated once, kept across upgrades and uninstalls
     (without it, logins fail with "no backend account configured"). */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace "sprigdb-gateway-backends" }}
apiVersion: v1
kind: Secret
metadata:
  name: sprigdb-gateway-backends
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- /* With TLS, MariaDB's certificates come from the DC's CA, not a
     public one: the per-user connections check them against the CA bundle
     every gateway mounts. A secret made before ca_file was written gets it
     added; its password stays. */}}
{{- $ca := "/etc/sprigdb/ca/ca.crt" }}
data:
  {{- if $old }}
  {{- $text := index $old.data "backends.toml" | b64dec }}
  {{- if and .Values.tls.enabled (not (contains "ca_file" $text)) (contains "tls = \"verify\"\n" $text) }}
  {{- $text = replace "tls = \"verify\"\n" (printf "tls = \"verify\"\nca_file = \"%s\"\n" $ca) $text }}
  {{- end }}
  backends.toml: {{ $text | b64enc }}
  {{- else if .Values.tls.enabled }}
  backends.toml: {{ printf "[per_user]\nsecret = \"file:backends.toml#backend_secret\"\ntls = \"verify\"\nca_file = \"%s\"\n[backend_secret]\npassword = \"%s\"\n" $ca (randAlphaNum 48) | b64enc }}
  {{- else }}
  backends.toml: {{ printf "[per_user]\nsecret = \"file:backends.toml#backend_secret\"\ntls = \"skip_verify\"\n[backend_secret]\npassword = \"%s\"\n" (randAlphaNum 48) | b64enc }}
  {{- end }}
