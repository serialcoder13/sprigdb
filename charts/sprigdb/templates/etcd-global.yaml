{{- /* One global voter in this DC, when global.voter.enabled. */}}
{{- if .Values.global.voter.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sprigdb-etcd-global
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  serviceName: sprigdb-etcd-global
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: etcd-global}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: etcd-global
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: etcd
          image: {{ .Values.etcd.image }}
          command: ["/usr/local/bin/etcd"]
          args:
            - --name={{ .Values.dc.id }}
            - --data-dir=/var/lib/etcd
            - --auto-compaction-mode={{ .Values.etcd.autoCompaction.mode }}
            - --auto-compaction-retention={{ .Values.etcd.autoCompaction.retention }}
            - --listen-client-urls={{ $s := ternary "https" "http" .Values.tls.enabled }}{{ $s }}://0.0.0.0:2379
            - --advertise-client-urls={{ $s }}://{{ .Values.global.voter.advertise }}:2379
            - --listen-peer-urls={{ $s }}://0.0.0.0:2380
            - --initial-advertise-peer-urls={{ $s }}://{{ .Values.global.voter.advertise }}:2380
            {{- if .Values.tls.enabled }}
            - --client-cert-auth
            - --trusted-ca-file=/etc/etcd/ca/ca.crt
            - --cert-file=/etc/etcd/tls/tls.crt
            - --key-file=/etc/etcd/tls/tls.key
            - --peer-client-cert-auth
            - --peer-trusted-ca-file=/etc/etcd/ca/ca.crt
            - --peer-cert-file=/etc/etcd/tls/tls.crt
            - --peer-key-file=/etc/etcd/tls/tls.key
            {{- end }}
          ports:
            - {name: client, containerPort: 2379}
            - {name: peer, containerPort: 2380}
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /etc/etcd/tls, readOnly: true}
            - {name: ca, mountPath: /etc/etcd/ca, readOnly: true}
            {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret: {secretName: sprigdb-etcd-global-tls}
        - name: ca
          configMap: {name: {{ .Values.tls.bundleConfigMap }}}
      {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.etcd.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-etcd-global
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/component: etcd-global}
  ports:
    - {name: client, port: 2379}
    - {name: peer, port: 2380}
{{- end }}
